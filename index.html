function iconCandidates(name){
 const s=String(name||'').trim(); const mapped=ICON_MAP[s]||s;

 if(mapped.includes(':')) list.push(mapped.replaceAll(':',''), mapped.replaceAll(':',' '));

}

function numVal(root,tags){for(const tag of tags){const e=root.querySelector(tag);if(e){const n=parseInt(e.textContent);if(!isNaN(n))return n}}return 0}
function allNums(root,tags){const nums=[];tags.forEach(tag=>root.querySelectorAll(tag).forEach(e=>{const n=parseInt(e.textContent);if(!isNaN(n))nums.push(n)}));return nums}
function statsFromSave(root,player){
 const money=numVal(player,['totalMoneyEarned','moneyEarned','totalMoney']) || numVal(root,['stats > totalMoneyEarned','totalMoneyEarned']);
 const deepest=numVal(player,['deepestMineLevel']) || numVal(root,['deepestMineLevel']);
 const skillTags=['farmingLevel','miningLevel','combatLevel','foragingLevel','fishingLevel'];
 const skillLevels=skillTags.map(t=>numVal(player,[t]));
 const cookedCount=Object.keys(cookedDict(root)).length;
 const crafting=dictByName(root,'craftingRecipes');
 const craftedCount=Object.values(crafting).filter(v=>parseInt(v)>0).length;
 let fishCaught=0;
 root.querySelectorAll('fishCaught > item').forEach(it=>{
   const v=numVal(it,['value > ArrayOfInt > int','value > int']);
   if(v>0) fishCaught++;
 });
 const fishTotal=allNums(root,['fishCaught > item > value > ArrayOfInt > int','fishCaught > item > value > int']).reduce((a,b)=>a+b,0);
 const donations=root.querySelectorAll('museumPieces > item').length;
 const help=numVal(root,['stats > questsCompleted','questsCompleted','numberOfHelpRequestsCompleted']);
 const house=numVal(player,['houseUpgradeLevel','upgradeLevel']);
 return {money,deepest,skillLevels,cookedCount,craftedCount,fishCaught,fishTotal,donations,help,house};
}
function verifyAchievements(root,player,ids){

 const mark=(id,cond,method)=>{ if(cond && verified[id] && !verified[id].done){verified[id]={done:true,method};} };

 mark(43,stats.skillLevels.filter(n=>n>=10).length>=5,'All five main skills level 10');

function estimateDifficulty(item,have,need,base){
 if(have>=need) return 'Easy';
 if(base) return base;
 if(/Hardwood|Rabbit|Prismatic|Pale Ale/i.test(item)) return 'Hard';
 if(/Gold-quality/i.test(item)) return 'Medium';

function parseRequests(root,inventory){
 const requests=[];
 root.querySelectorAll('questLog > Quest').forEach(q=>{
   const completed=direct(q,'completed')==='true';
   if(completed) return;
   const accepted=direct(q,'accepted')==='true';
   const title=direct(q,'questTitle')||direct(q,'_questTitle')||'Request';
   const obj=direct(q,'_currentObjective')||direct(q,'_questDescription')||'';
   const target=direct(q,'target')||'';
   const itemRaw=direct(q,'item')||'';
   const id=normId(itemRaw);
   const item=(DELIVERY_INFO[id]?.item)||itemName(id)||itemRaw||'Unknown item';
   const need=parseInt(direct(q,'number')||'1')||1;
   const have=(inventory[id]||inventory[item]||0);
   const info=DELIVERY_INFO[id]||{};
   const diff=estimateDifficulty(item,have,need,info.difficulty);
   requests.push({source:"Help Wanted / Quest Board",status:accepted?"Accepted":"Available / Not Accepted",title,requester:target,item,need,have,progress:Math.min(have,need),reward:(direct(q,'moneyReward')||'')+'g',where:info.where||obj,difficulty:diff,canDo:have>=need});
 });
 function parseOrderList(tag,status){
   root.querySelectorAll(tag+' > SpecialOrder').forEach(o=>{
     const key=direct(o,'questKey')||'';
     const requester=direct(o,'requester')||key||'Special Order';
     const info=REQUEST_INFO[key]||{};
     const title=info.title||friendlyFlag(key||direct(o,'questName')||'Special Order');
     const reward=[...o.querySelectorAll('rewards[xsi\\:type="MoneyReward"] int, rewards int')].map(x=>x.textContent)[0]||'';
     const objectives=[...o.querySelectorAll(':scope > objectives')].map(ob=>{
       const cur=parseInt(direct(ob,'currentCount')||'0')||0;
       const max=parseInt(direct(ob,'maxCount')||'0')||0;
       const tags=direct(ob,'acceptableContextTagSets')||'';
       return {cur,max,tags,type:ob.getAttribute('xsi:type')||''};
     });
     const best=objectives[0]||{cur:0,max:0,tags:''};
     let item=info.item||best.tags.replace(/^item_/,'').replaceAll('_',' ')||'Required items';
     item=item.replace('!forage item, category vegetable, quality gold','Gold-quality vegetables');
     const have=(item==='Hardwood'?(inventory['709']||inventory['Hardwood']||0): item==='Leek'?(inventory['20']||inventory['Leek']||0):0);
     const need=best.max||info.needed||0;
     const diff=estimateDifficulty(item,have,need,info.difficulty);
     requests.push({source:"Special Orders Board",status,title,requester,item,need,have,progress:best.cur,reward:reward?reward+'g':'Special reward',where:info.where||'Check Special Orders board details in town.',difficulty:diff,canDo:have>=need || best.cur>=need,objectives});
   });
 }
 parseOrderList('specialOrders','Accepted');
 parseOrderList('availableSpecialOrders','Available / Not Accepted');
 return requests;
}
function renderRequests(data){

 const available=req.filter(r=>r.status!=='Accepted');
 const card=r=>`<div class="item ${r.canDo?'done':r.difficulty==='Easy'?'partial':'missing'}" data-name="${(r.title+' '+r.item+' '+r.requester).toLowerCase()}"><div class="itemPic">${img(r.item,'📋')}</div><div><div class="itemTitle">${r.title}</div><div class="itemSub">${r.source} • ${r.status}</div><div class="itemSub"><b>Requester:</b> ${r.requester||'Unknown'}</div><div class="itemSub"><b>Need:</b> ${r.need?`${r.progress||0}/${r.need} ${r.item}`:r.item}</div><div class="itemSub"><b>You have:</b> ${r.have||0} ${r.item}</div><div class="itemSub"><b>Reward:</b> ${r.reward||'Unknown'}</div><div class="legend">${statusPill(r.difficulty,difficultyClass(r.difficulty))}${r.canDo?statusPill('Can complete now','yes'):statusPill('Not ready','warn')}</div><div class="help"><b>How:</b> ${r.where||'Check board details.'}</div></div></div>`;
 $('requests').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📋</span><span>Requests & Special Orders</span></h2><p class="mini">Tracks requests you accepted and requests currently offered but not accepted yet. Difficulty is estimated from the save, item type, and basic Stardew sources.</p><input class="search" placeholder="Search requests..." oninput="filterCards(this,'requestList')"><br><br><h3>Accepted</h3><div class="items" id="requestList">${accepted.map(card).join('')||'<div class="empty">No accepted requests detected.</div>'}</div><br><h3>Available / Not Accepted</h3><div class="items">${available.map(card).join('')||'<div class="empty">No available board requests detected in save.</div>'}</div></div>`;
}

function hasMaterials(inv, mats){
 const missing=[];
 Object.entries(mats||{}).forEach(([name,need])=>{
   let have=inv[name]||inv[normId(name)]||0;
   if(name==="Any Fish") have=FISH_LIST.reduce((a,f)=>a+(inv[f.id]||inv[f.name]||0),0);
   if(have<need) missing.push({name,need,have,where:MATERIAL_HELP[name]||"Check Stardew Wiki or shops/foraging."});
 });
 return missing;
}
function parseFishCaught(root){
 const out={};
 root.querySelectorAll('fishCaught > item').forEach(it=>{
   const id=txt(it,'key > int')||txt(it,'key > string');
   const nums=[...it.querySelectorAll('value int')].map(x=>parseInt(x.textContent)).filter(n=>!isNaN(n));
   const count=nums.reduce((a,b)=>a+b,0);
   if(id && count>0) out[normId(id)]=count;
 });
 return out;
}
function renderReady(data){
 const inv=data.inventory||{};
 const craftRows=CRAFTING.filter(n=>data.crafting[n]!==undefined && !((data.crafting[n]||0)>0)).map(n=>({type:"Crafting",name:n,missing:hasMaterials(inv,CRAFT_MATS[n])})).filter(x=>CRAFT_MATS[x.name]);
 const cookRows=COOKING.filter(n=>data.cookingLearned[n]!==undefined && !((data.cooked[n]||0)>0)).map(n=>({type:"Cooking",name:n,missing:hasMaterials(inv,COOK_MATS[n])})).filter(x=>COOK_MATS[x.name]);
 const rows=[...craftRows,...cookRows].sort((a,b)=>a.missing.length-b.missing.length);
 const card=r=>`<div class="item ${r.missing.length?'partial':'done'}" data-name="${(r.name+' '+r.type).toLowerCase()}"><div class="itemPic">${img(r.name,'✅')}</div><div><div class="itemTitle">${r.name}</div><div class="itemSub">${r.type} • ${r.missing.length?'Missing '+r.missing.length+' item type(s)':'Ready now'}</div>${r.missing.length?`<div class="help"><b>Missing:</b><br>${r.missing.map(m=>`${m.name}: ${m.have}/${m.need}<br><span class="mini">${m.where}</span>`).join('<br>')}</div>`:`<div class="help"><b>You have everything needed.</b> Make this now to complete progress.</div>`}</div></div>`;
 $('ready').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">✅</span><span>Ready Now: Crafting & Cooking</span></h2><p class="mini">Checks learned recipes against detected inventory/storage items in the save. Shows what is ready now and what materials are missing.</p><input class="search" placeholder="Search ready/craft/cook..." oninput="filterCards(this,'readyList')"><br><br><div class="items" id="readyList">${rows.map(card).join('')||'<div class="empty">No learned incomplete recipes with material data available yet.</div>'}</div></div>`;
}
function renderFish(data){
 const caught=data.fishCaught||{};
 const done=FISH_LIST.filter(f=>caught[f.id]);
 const missing=FISH_LIST.filter(f=>!caught[f.id]);
 const card=(f,ok)=>`<div class="item ${ok?'done':'missing'}" data-name="${f.name.toLowerCase()}"><div class="itemPic">${img(f.name,'🎣')}</div><div><div class="itemTitle">${f.name}</div><div class="itemSub">${ok?'Caught '+caught[f.id]+' time(s)':'Not caught yet'}</div><div class="help"><b>Where:</b> ${f.where}<br><b>When:</b> ${f.when}</div></div></div>`;
 $('fish').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🎣</span><span>Fish Collection</span></h2><p class="mini">Shows fish caught from the save file and fish still missing, with where/when hints.</p><div class="countGrid"><div class="countBox"><b>${done.length}</b>Caught</div><div class="countBox"><b>${missing.length}</b>Missing</div><div class="countBox"><b>${FISH_LIST.length}</b>Tracked Fish</div></div><input class="search" placeholder="Search fish..." oninput="filterCards(this,'fishList')"><br><br><div class="items" id="fishList">${done.map(f=>card(f,true)).join('')}${missing.map(f=>card(f,false)).join('')}</div></div>`;
}

function render(data){const craftedDone=CRAFTING.filter(n=>(data.crafting[n]||0)>0 || isManual('crafting',n)).length;const craftedLearned=CRAFTING.filter(n=>data.crafting[n]!==undefined).length;const cookedDone=COOKING.filter(n=>(data.cooked[n]||0)>0 || isManual('cooking',n)).length;const cookingLearned=COOKING.filter(n=>data.cookingLearned[n]!==undefined).length;const bookDone=BOOKS.filter(b=>(data.booksRead&&data.booksRead[b.key])||data.mail.some(f=>f.includes(b.key))||isManual('books',b.name)).length;const achDone=data.achVerified ? Object.values(data.achVerified).filter(x=>x.done).length : data.achievements.length;
$('dash').innerHTML=stat('🏡','Farm',data.farmName||'Unknown',data.playerName||'Player','')+stat('📅','Date',`${seasonName(data.season)} ${data.day}, Year ${data.year}`,'','')+stat('💰','Gold',Number(data.money||0).toLocaleString(),'Current money','')+stat('🐟','Ponds',data.ponds.length,data.ponds.length?'Detected on farm':'None detected','')+stat('🛠️','Crafting',`${craftedDone}/${CRAFTING.length}`,`${craftedLearned} learned • ${craftedDone} crafted`,'')+stat('🍳','Cooking',`${cookedDone}/${COOKING.length}`,`${cookingLearned} learned • ${cookedDone} cooked`,'')+stat('📚','Books',`${bookDone}/${BOOKS.length}`,'Save detected','')+stat('🏆','Achievements',`${achDone}/49`,'verified from save','');renderGoals(data);renderRequests(data);renderReady(data);renderFish(data);renderPonds(data);renderCrafting(data);renderCooking(data);renderLetters(data);renderBooks(data);renderAchievements(data);renderMissing(data);renderManual();renderDiag(data)}
function renderCrafting(data){const learned=CRAFTING.filter(n=>data.crafting[n]!==undefined).length,done=CRAFTING.filter(n=>(data.crafting[n]||0)>0 || isManual('crafting',n)).length;$('crafting').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🛠️</span><span>Crafting: Learned vs Crafted</span></h2><p class="mini">Important: learned recipe and actually crafted are different in the save. Count 0 means learned but never crafted.</p><div class="legend">${statusPill('Learned + Crafted','yes')}${statusPill('Learned Only','warn')}${statusPill('Not Learned','no')}${statusPill('','blue')}</div><div class="countGrid"><div class="countBox"><b>${learned}</b>Learned</div><div class="countBox"><b>${done}</b>Crafted</div><div class="countBox"><b>${CRAFTING.length-done}</b>Not crafted yet</div></div><input class="search" placeholder="Search crafting..." oninput="filterCards(this,'craftList')"><br><br><div class="items" id="craftList">${CRAFTING.map(n=>recipeCard('crafting',n,data.crafting[n])).join('')}</div></div>`}
function renderCooking(data){const learned=COOKING.filter(n=>data.cookingLearned[n]!==undefined).length,done=COOKING.filter(n=>(data.cooked[n]||0)>0 || isManual('cooking',n)).length;$('cooking').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🍳</span><span>Cooking: Learned vs Cooked</span></h2><p class="mini">This uses cookingRecipes for learned recipes and recipesCooked for actual cooked dishes.</p><div class="legend">${statusPill('Learned + Cooked','yes')}${statusPill('Learned Only','warn')}${statusPill('Not Learned','no')}${statusPill('','blue')}</div><div class="countGrid"><div class="countBox"><b>${learned}</b>Learned</div><div class="countBox"><b>${done}</b>Cooked</div><div class="countBox"><b>${COOKING.length-done}</b>Not cooked yet</div></div><input class="search" placeholder="Search cooking..." oninput="filterCards(this,'cookList')"><br><br><div class="items" id="cookList">${COOKING.map(n=>recipeCard('cooking',n,data.cooked[n],data.cookingLearned[n]!==undefined)).join('')}</div></div>`}
function recipeCard(section,name,count,learnedOverride){let learned=(section==='crafting')?count!==undefined:learnedOverride;let completed=(parseInt(count)||0)>0||isManual(section,name);let state=completed?'done':learned?'partial':'missing';let sub=completed?`${section==='crafting'?'Crafted':'Cooked'} ${parseInt(count)||0} time(s)`:learned?'Learned, but not completed yet':'Not learned yet';return `<div class="item ${cardCls(state)} ${isManual(section,name)?'':''}" data-name="${name.toLowerCase()}"><div class="itemPic">${img(name,completed?'✅':'?')}</div><div><div class="itemTitle">${name}</div><div class="itemSub">${learned?statusPill('Learned','purple'):statusPill('Not learned','no')} ${completed?statusPill(section==='crafting'?'Crafted':'Cooked','yes'):statusPill(section==='crafting'?'Not crafted':'Not cooked','warn')}</div><div class="itemSub">${sub}</div>${!completed&&!learned?`<div class="help">${section==='cooking'?'Find recipe from TV, mail, friendship, shop, or festival.':'Learn this recipe from skills, shops, quests, mail, or special unlocks.'}</div>`:''}</div></div>`}
function renderPonds(data){const ponds=data.ponds;$('ponds').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🐟</span><span>Fish Pond Dashboard</span></h2><p class="mini">Now reads the actual FishPond building fields: fishType, currentOccupants, maxOccupants, neededItem, and neededItemCount.</p>${ponds.length?`<div class="ponds">${ponds.map((p,i)=>{const need=p.needed&&p.needed!=='Unknown'&&p.needed.length<60;return `<div class="pond"><div class="pondHead"><div class="icon">${img(p.type,'🐟')}</div><div><h3>Pond #${i+1}: ${p.type}</h3><div class="mini">Fish ID ${p.fishId||'?'} • Gate ${p.gate||'?'}</div></div></div><br><div class="pondMeter"><span style="width:${pct(p.count,p.max)}%"></span></div><p><b>Population:</b> ${p.count}/${p.max}</p><p><b>Status:</b> ${need?statusPill('Waiting for request item','warn'):statusPill('Growing / no request detected','yes')}</p><p><b>Request:</b> ${need?statusPill(`${p.neededCount||''} ${p.needed}`,'no'):'None detected'}</p>${need&&HELP[p.needed]?`<div class="help"><b>How to get ${p.needed}:</b> ${HELP[p.needed]}</div>`:''}</div>`}).join('')}</div>`:'<div class="empty">No fish ponds detected.</div>'}</div>`}
function renderAchievements(data){const verified=data.achVerified||{};const doneCount=Object.values(verified).filter(x=>x.done).length;const idCount=data.achievements.length;const rows=ACH_ORDER.map(id=>{const v=verified[id]||{done:false,method:'Not detected'};return {id,name:ACH[id]||`Achievement ID ${id}`,desc:ACH_DESC[id]||'',done:v.done,method:v.method}});$('achievements').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🏆</span><span>Achievements</span></h2><p class="mini">Verified using achievement IDs plus save stats. This helps match Steam when some achievements are implied by progress.</p><div class="bar"><div class="fill" style="width:${pct(doneCount,49)}%"></div></div><div class="countGrid"><div class="countBox"><b>${doneCount}</b>Verified complete</div><div class="countBox"><b>${idCount}</b>Raw IDs in save</div><div class="countBox"><b>49</b>Total achievements</div></div><div class="help">If Steam and the save disagree, this page shows the method used: raw Achievement ID or verified from stats such as mine level, skill level, fish caught, cooked recipes, etc.</div><br><div class="items">${rows.map(r=>`<div class="item ${r.done?'done':'missing'}" data-name="${r.name.toLowerCase()}"><div class="itemPic">${img(ACH_ICON[r.id]||"Achievement Star 10.png","🏆")}</div><div><div class="itemTitle">${r.name}</div><div class="itemSub">${r.desc}</div><div class="itemSub">ID ${r.id} • ${r.done?'Complete':'Not complete'} • ${r.method}</div></div></div>`).join('')}</div></div>`}
function renderLetters(data){let labels=data.mail.map(f=>LETTER_LABELS[f]||friendlyFlag(f));$('letters').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📬</span><span>Letters & Rewards</span></h2><p class="mini">Renamed from mail flags. These are letters, rewards, introductions, and event states saved by Stardew.</p><input class="search" placeholder="Search letters and rewards..." oninput="filterCards(this,'lettersList')"><br><br><div class="items" id="lettersList">${labels.slice(0,250).map(n=>`<div class="item done" data-name="${n.toLowerCase()}"><div class="itemPic">✉️</div><div><div class="itemTitle">${n}</div><div class="itemSub">Detected in save</div></div></div>`).join('')||'<div class="empty">No letters detected.</div>'}</div></div>`}
const LETTER_LABELS={guildMember:"Adventurer's Guild unlocked",wizardJunimoNote:"Wizard invitation / Community Center magic",hasRustyKey:"Sewer Key received",MagnifyingGlass:"Magnifying Glass unlocked",ccPantry:"Pantry completed",ccBoilerRoom:"Boiler Room completed",ccFishTank:"Fish Tank completed",ccCraftsRoom:"Crafts Room completed",ccBulletin:"Bulletin Board completed",ccVault:"Vault progress detected",ccVaultComplete:"Vault completed"};
function friendlyFlag(f){return String(f).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase())}
function renderBooks(data){const rows=BOOKS.map(b=>({name:b.name,key:b.key,img:b.img,hit:(data.booksRead&&data.booksRead[b.key])||data.mail.some(f=>f.includes(b.key))||isManual('books',b.name),source:(data.booksRead&&data.booksRead[b.key])?'Save stats':(data.mail.some(f=>f.includes(b.key))?'Mail/flag':(isManual('books',b.name)?'Manual':'Not detected'))}));$('books').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📚</span><span>Books Read</span></h2><p class="mini">Book parsing is based on saved book flags when present, with  checkbox support.</p><div class="items">${rows.map(b=>`<div class="item ${b.hit?'done':'missing'} ${isManual('books',b.name)?'':''}" data-name="${b.name.toLowerCase()}"><div class="itemPic">${img(b.img||b.name,'📘')}</div><div><div class="itemTitle">${b.name}</div><div class="itemSub">${b.hit?'Read / detected • '+b.source:'Not detected'}</div><div class="itemSub mono">${b.key}</div></div></div>`).join('')}</div></div>`}
function renderMissing(data){const important=['Battery Pack','Basalt','Coral','Snail','Catfish','Walleye',"Rabbit's Foot",'Coconut','Cactus Fruit','Jade','Ruby'];$('missing').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🔎</span><span>Missing Item Help Guide</span></h2><p class="mini">Quick hints for commonly forgotten items and fish pond/community center blockers.</p><div class="items">${important.map(n=>`<div class="item"><div class="itemPic">${img(n,'❓')}</div><div><div class="itemTitle">${n}</div><div class="itemSub">${HELP[n]||'Helpful item to track.'}</div></div></div>`).join('')}</div></div>`}
function renderManual(){$('').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📝</span><span>Manual Notes & Overrides</span></h2><p class="mini">es are saved only in this browser. They do not modify your Stardew save.</p><textarea id="notes" style="width:100%;min-height:160px;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fffef8" placeholder="Example: Buy strawberries Spring 13, save coral for Blobfish pond...">${localStorage.getItem('stardewNotes')||''}</textarea><br><br><button onclick="localStorage.setItem('stardewNotes',$('notes').value)">Save Notes</button> <button class="secondary" onclick="localStorage.removeItem('stardewNotes');$('notes').value=''">Clear Notes</button></div>`}
function renderGoals(data){const goals=[];data.ponds.forEach(p=>{if(p.needed&&p.needed!=='Unknown'&&p.needed.length<60)goals.push(['high','🐟',`${p.type} pond needs ${p.neededCount||''} ${p.needed}`,HELP[p.needed]||'Complete this request to raise pond population.']);});if(!data.crafting['Lightning Rod'])goals.push(['high','🌩️','Craft Lightning Rod','Needed for Battery Packs after storms.']);if(!data.crafting['Crystalarium'])goals.push(['mid','💎','Get or craft Crystalarium','Best first use: Jade for Sunday staircases, or Diamond for money/gifts.']);if(String(data.season).toLowerCase()==='spring')goals.push(['mid','🍓','Save money for Egg Festival strawberries','Spring 13. Buy Strawberry Seeds there.']);if(!data.cooked['Lucky Lunch'])goals.push(['low','🍀','Prepare Lucky Lunch later','Sea Cucumber + Blue Jazz + Tortilla. Great for Skull Cavern.']);$('goals').innerHTML=`<div class="grid"><div class="card span8"><h2 class="visualTitle"><span class="emoji">🎯</span><span>What Should I Do Next?</span></h2><p class="mini">Personalized recommendations from your imported save.</p>${goals.map((g,i)=>`<div class="row goal ${g[0]}"><div><div class="smallcaps">Priority ${i+1}</div><b>${g[1]} ${g[2]}</b><div class="mini">${g[3]}</div></div><span class="pill ${g[0]==='high'?'no':g[0]==='mid'?'blue':'yes'}">${g[0]}</span></div>`).join('')||'<div class="empty">No urgent goals detected.</div>'}</div><div class="card span4"><h2>🧠 Forgetful Mode</h2><p>The tracker now separates learned vs crafted/cooked and shows  overrides.</p><div class="season"><b>Today:</b><br>${seasonName(data.season)} ${data.day}, Year ${data.year}</div></div></div>`}
function renderDiag(data){$('diag').innerHTML=`<div class="card span12"><h2>⚙️ Parser Diagnostics</h2><p class="mini">Use this when something looks wrong.</p><pre class="diag">${escapeHtml(JSON.stringify({file:data.fileName,player:data.playerName,farm:data.farmName,year:data.year,day:data.day,season:data.season,seasonSource:data.sources.season,achievementIds:data.achievements,rawAchievementCount:data.achievements.length,verifiedAchievementCount:data.achVerified?Object.values(data.achVerified).filter(x=>x.done).length:data.achievements.length,achievementStats:data.achStats,craftingLearned:Object.keys(data.crafting).length,craftingActuallyCrafted:Object.values(data.crafting).filter(v=>parseInt(v)>0).length,cookingLearned:Object.keys(data.cookingLearned).length,cookedDishes:Object.keys(data.cooked).length,mailCount:data.mail.length,booksRead:data.booksRead,bookCount:Object.keys(data.booksRead||{}).length,ponds:data.ponds},null,2))}</pre></div>`}
function escapeHtml(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function filterCards(input,listId){const q=input.value.toLowerCase();[...$(listId).children].forEach(c=>c.style.display=c.dataset.name.includes(q)?'flex':'none')}
function parseSave(text,fileName){const root=new DOMParser().parseFromString(text,'text/xml');if(root.querySelector('parsererror'))throw new Error('XML parse error');const player=root.querySelector('player')||root;const season=firstText(root,['currentSeason','season','seasonForSaveGame']);const year=firstText(root,['year']);const day=firstText(root,['dayOfMonth','day']);const crafting=dictByName(root,'craftingRecipes');const cookingLearned=dictByName(root,'cookingRecipes');const cooked=cookedDict(root);const achIds=achievements(root);const achV=verifyAchievements(root,player,achIds);const statsMap=customStats(root);const booksRead=bookMapFromStats(statsMap);const data={fileName,playerName:direct(player,'name')||txt(player,'name'),farmName:direct(player,'farmName')||txt(player,'farmName'),year:year.value,season:season.value,day:day.value,money:direct(player,'money')||txt(player,'money')||txt(root,'money')||0,crafting,cookingLearned,cooked,statsMap,booksRead,mail:mail(root),inventory:invCounts(root),fishCaught:parseFishCaught(root),requests:parseRequests(root,invCounts(root)),ponds:parsePonds(root),achievements:achIds,achVerified:achV.verified,achStats:achV.stats,sources:{season:season.source,year:year.source,day:day.source}};window.lastData=data;return data}
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=parseSave(await f.text(),f.name);localStorage.setItem('lastImportName',f.name);render(data)}catch(err){console.warn('Save import warning:',err)}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.tab).classList.add('active')});
render({fileName:'none',playerName:'No save imported',farmName:'Import save',year:'?',season:'?',day:'?',money:0,crafting:{},cookingLearned:{},cooked:{},statsMap:{},booksRead:{},mail:[],inventory:{},fishCaught:{},requests:[],ponds:[],achievements:[],achVerified:{},achStats:{},sources:{season:'not loaded',year:'not loaded',day:'not loaded'}});
