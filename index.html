<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stardew Companion Tracker</title>
<style>
:root{
  --bg:#f3dfad;--bg2:#fff6df;--card:#fffaf0;--ink:#2f2416;--muted:#765f3c;
  --line:#d4aa5b;--green:#4f8f3a;--green2:#7fbd4e;--blue:#4b7fa8;--red:#af4b3d;
  --gold:#d89b27;--purple:#7c5aa6;--shadow:0 10px 28px rgba(70,44,13,.18);
  --r:16px;
}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfe6ff 0,#e3f5ff 170px,#f3dfad 171px,#efe0bf 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(#7eb15c 1.2px,transparent 1.2px);background-size:22px 22px;}
header{position:relative;background:linear-gradient(135deg,#4f8f3a,#80bd52);color:#fff;border-bottom:6px solid #326326;box-shadow:var(--shadow)}
.wrap{max-width:1240px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:30px}.subtitle{margin:5px 0 0;color:#efffe8}.importBox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.45);padding:10px;border-radius:14px}.fileLabel,button{border:0;border-radius:11px;background:#2f6d35;color:white;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:pointer}.fileLabel input{display:none}button.secondary{background:#3f719b}.note{font-size:12px;color:#fff8d5;max-width:430px}.kbd{font-family:Consolas,monospace;background:#fff;color:#332712;border:1px solid #d3b16e;border-radius:5px;padding:2px 5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:16px}.card{background:rgba(255,250,240,.96);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:15px}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:span 6}.span8{grid-column:span 8}.span12{grid-column:span 12}@media(max-width:920px){.grid{grid-template-columns:1fr}.span3,.span4,.span6,.span8,.span12{grid-column:1}.wrap{padding:12px}}
.stat{display:flex;gap:12px;align-items:center}.icon{width:52px;height:52px;border-radius:13px;background:#f2db9f;border:2px solid #bd8f36;display:grid;place-items:center;font-size:28px;overflow:hidden}.icon img,.itemPic img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.stat h3{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.big{font-size:24px;font-weight:900}.mini{font-size:12px;color:var(--muted);line-height:1.35}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;background:rgba(243,223,173,.92);backdrop-filter:blur(6px);padding:8px;border-radius:14px}.tab{background:#fff7e5;color:#3b2a16;border:2px solid var(--line);box-shadow:none}.tab.active{background:#4b7fa8;color:white;border-color:#315d7e}.section{display:none}.section.active{display:block}.bar{height:14px;background:#ead4a4;border:1px solid #c29d59;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8bd15c,#40863c);width:0%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ecd7a9;padding:10px 0}.row:last-child{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;white-space:nowrap}.yes{background:#dff4d8;color:#246b2a}.no{background:#f7d9d2;color:#8d2b1e}.warn{background:#fff0b8;color:#855a00}.blue{background:#dbeeff;color:#22557d}.purple{background:#eadfff;color:#5c3d84}.search{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:#fffef8;font-size:15px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.item{background:#fffdf5;border:1px solid #e3c88d;border-radius:13px;padding:10px;display:flex;gap:10px;align-items:center;min-height:66px}.item.done{background:#eef9e9;border-color:#9ed48a}.item.missing{opacity:.72}.itemPic{width:42px;height:42px;border-radius:10px;background:#ead4a4;display:grid;place-items:center;font-size:23px;flex:0 0 auto;overflow:hidden}.itemTitle{font-weight:900}.itemSub{font-size:12px;color:var(--muted);margin-top:2px}.help{margin-top:7px;background:#fff3cc;border-left:4px solid var(--gold);padding:7px;border-radius:8px;font-size:12px;color:#5d461e}.ponds{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}.pond{background:linear-gradient(160deg,#e4f5ff,#fff8e8);border:2px solid #85b6cc;border-radius:15px;padding:14px}.pondHead{display:flex;align-items:center;gap:12px}.pondMeter{height:17px;background:#d6edf7;border-radius:20px;overflow:hidden;border:1px solid #7fb1c9}.pondMeter span{display:block;height:100%;background:linear-gradient(90deg,#4ca0c9,#1e6f9b)}.empty{color:var(--muted);padding:18px;text-align:center}.goal{border-left:6px solid var(--gold);background:#fff7df}.goal.high{border-color:#d04b3c}.goal.mid{border-color:#4b7fa8}.goal.low{border-color:#4f8f3a}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:760px){.two{grid-template-columns:1fr}}
a{color:#2f6d9d;text-decoration:none;font-weight:800}.smallcaps{text-transform:uppercase;letter-spacing:.4px;font-size:11px;color:var(--muted);font-weight:800}.footer{text-align:center;color:#6d5738;font-size:12px;padding:28px}.season{background:#fff3cc;border:2px dashed #d5a246;border-radius:14px;padding:12px}.visualTitle{display:flex;gap:10px;align-items:center;margin:0 0 10px}.visualTitle .emoji{font-size:30px}.danger{color:#8c2b1d;font-weight:800}.ok{color:#2e7131;font-weight:800}
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div><h1>🌾 Stardew Companion Tracker</h1><p class="subtitle">Visual local save guide for forgetful perfection runs • GitHub Pages friendly</p></div>
    <div class="importBox">
      <label class="fileLabel">Import Save File<input id="fileInput" type="file" /></label>
      <button class="secondary" id="demoBtn">Demo</button>
      <div class="note">Select your main save file, e.g. <span class="kbd">FarmName_123456789</span>. Do not select <span class="kbd">SaveGameInfo</span>.</div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="dash"></div>
  <div class="tabs">
    <button class="tab active" data-tab="goals">🎯 What Next?</button>
    <button class="tab" data-tab="ponds">🐟 Fish Ponds</button>
    <button class="tab" data-tab="crafting">🛠️ Crafted</button>
    <button class="tab" data-tab="cooking">🍳 Cooking</button>
    <button class="tab" data-tab="letters">📬 Letters & Rewards</button>
    <button class="tab" data-tab="books">📚 Books</button>
    <button class="tab" data-tab="achievements">🏆 Achievements</button>
    <button class="tab" data-tab="missing">🔎 Missing Help</button>
  </div>
  <section class="section active" id="goals"></section>
  <section class="section" id="ponds"></section>
  <section class="section" id="crafting"></section>
  <section class="section" id="cooking"></section>
  <section class="section" id="letters"></section>
  <section class="section" id="books"></section>
  <section class="section" id="achievements"></section>
  <section class="section" id="missing"></section>
</main>
<div class="footer">Local-only tracker. Your save file is read inside your browser. Nothing is uploaded.</div>
<script>
const wiki = n => `https://stardewvalleywiki.com/Special:Redirect/file/${encodeURIComponent(n.replaceAll(' ','_'))}.png`;
const CRAFTING=["Chest","Stone Chest","Big Chest","Wood Fence","Stone Fence","Iron Fence","Hardwood Fence","Gate","Torch","Campfire","Wood Path","Gravel Path","Cobblestone Path","Stepping Stone Path","Crystal Path","Straw Floor","Weathered Floor","Brick Floor","Wood Floor","Rustic Plank Floor","Stone Walkway Floor","Crystal Floor","Wild Seeds (Sp)","Wild Seeds (Su)","Wild Seeds (Fa)","Wild Seeds (Wi)","Field Snack","Scarecrow","Deluxe Scarecrow","Quality Sprinkler","Iridium Sprinkler","Tapper","Heavy Tapper","Furnace","Charcoal Kiln","Recycling Machine","Preserves Jar","Keg","Bee House","Cheese Press","Mayonnaise Machine","Oil Maker","Loom","Lightning Rod","Crystalarium","Seed Maker","Slime Egg-Press","Slime Incubator","Bomb","Cherry Bomb","Mega Bomb","Staircase","Life Elixir","Warp Totem: Farm","Warp Totem: Mountains","Warp Totem: Beach","Warp Totem: Desert","Rain Totem","Cookout Kit","Mini-Jukebox","Farm Computer","Geode Crusher","Bone Mill","Solar Panel","Ostrich Incubator","Deluxe Retaining Soil","Quality Retaining Soil","Basic Retaining Soil","Basic Fertilizer","Quality Fertilizer","Deluxe Fertilizer","Speed-Gro","Deluxe Speed-Gro","Hyper Speed-Gro","Fiber Seeds","Tea Sapling"];
const COOKING=["Fried Egg","Omelet","Salad","Cheese Cauliflower","Baked Fish","Parsnip Soup","Vegetable Medley","Complete Breakfast","Fried Calamari","Strange Bun","Lucky Lunch","Fried Mushroom","Pizza","Bean Hotpot","Glazed Yams","Carp Surprise","Hashbrowns","Pancakes","Salmon Dinner","Fish Taco","Crispy Bass","Pepper Poppers","Bread","Tom Kha Soup","Trout Soup","Chocolate Cake","Pink Cake","Rhubarb Pie","Cookie","Spaghetti","Fried Eel","Spicy Eel","Sashimi","Maki Roll","Tortilla","Red Plate","Eggplant Parmesan","Rice Pudding","Ice Cream","Blueberry Tart","Autumn's Bounty","Pumpkin Soup","Super Meal","Cranberry Sauce","Stuffing","Farmer's Lunch","Survival Burger","Dish O' The Sea","Miner's Treat","Roots Platter","Triple Shot Espresso","Seafoam Pudding","Algae Soup","Pale Broth","Plum Pudding","Artichoke Dip","Stir Fry","Roasted Hazelnuts","Pumpkin Pie","Radish Salad","Fruit Salad","Blackberry Cobbler","Cranberry Candy","Bruschetta","Coleslaw","Fiddlehead Risotto","Poppyseed Muffin","Chowder","Fish Stew","Escargot","Lobster Bisque","Maple Bar","Crab Cakes","Shrimp Cocktail","Ginger Ale","Banana Pudding","Mango Sticky Rice","Poi","Tropical Curry","Squid Ink Ravioli","Moss Soup"];
const STEAM_ACH=["Greenhorn","Cowpoke","Homesteader","Millionaire","Legend","A Complete Collection","A New Friend","Best Friends","The Beloved Farmer","Cliques","Networking","Popular","Cook","Sous Chef","Gourmet Chef","Moving Up","Living Large","D.I.Y.","Artisan","Craft Master","Fisherman","Ol' Mariner","Master Angler","Mother Catch","Treasure Trove","Gofer","A Big Help","Polyculture","Monoculture","Full Shipment","Prairie King","The Bottom","Local Legend","Joja Co. Member Of The Year","Mystery Of The Stardrops","Full House","Singular Talent","Master Of The Five Ways","Protector Of The Valley","Fector's Challenge","Infinite Power","Perfection","A Distant Shore","Danger In The Deep","Two Thumbs Up","Blue Ribbon","An Unforgettable Soup","Good Neighbors","Well-Read"];
const BOOKS=[
 {key:"Book_Mystery",name:"Book of Mysteries",img:"Book_Of_Mysteries"},{key:"Book_PriceCatalogue",name:"Price Catalogue",img:"Price_Catalogue"},{key:"Book_AnimalCatalogue",name:"Animal Catalogue",img:"Animal_Catalogue"},{key:"Book_Bombs",name:"Dwarvish Safety Manual",img:"Dwarvish_Safety_Manual"},{key:"Book_Roe",name:"Jewels Of The Sea",img:"Jewels_Of_The_Sea"},{key:"Book_WildSeeds",name:"Raccoon Journal",img:"Raccoon_Journal"},{key:"Book_Woodcutting",name:"Woody's Secret",img:"Woody's_Secret"},{key:"Book_Defense",name:"Jack Be Nimble, Jack Be Thick",img:"Jack_Be_Nimble_Jack_Be_Thick"},{key:"Book_Speed",name:"Way Of The Wind",img:"Way_Of_The_Wind_pt._1"},{key:"Book_Diamonds",name:"Diamond Hunter",img:"Diamond_Hunter"},{key:"Book_Crabbing",name:"The Art O' Crabbing",img:"The_Art_O_Crabbing"},{key:"Book_Trash",name:"The Alleyway Buffet",img:"The_Alleyway_Buffet"}
];
const LETTER_LABELS={guildMember:"Adventurer's Guild unlocked",ccVault:"Vault progress detected",wizardJunimoNote:"Wizard invitation / Community Center magic",hasRustyKey:"Sewer Key received",krobusUnseal:"Krobus / Sewer progress",MagnifyingGlass:"Magnifying Glass unlocked",ccPantry:"Pantry completed",ccBoilerRoom:"Boiler Room completed",ccFishTank:"Fish Tank completed",ccCraftsRoom:"Crafts Room completed",ccBulletin:"Bulletin Board completed",ccVaultComplete:"Vault completed"};
const ITEM_NAMES={"162":"Lava Eel","800":"Blobfish","140":"Walleye","698":"Sturgeon","155":"Super Cucumber","393":"Coral","570":"Basalt","82":"Fire Quartz","336":"Gold Bar","72":"Diamond","721":"Snail","604":"Plum Pudding","618":"Bruschetta","390":"Stone","66":"Amethyst","64":"Ruby","60":"Emerald","62":"Aquamarine","70":"Jade","749":"Omni Geode","535":"Geode","536":"Frozen Geode","537":"Magma Geode","787":"Battery Pack","766":"Slime","767":"Bat Wing","768":"Solar Essence","769":"Void Essence"};
const HELP={"Battery Pack":"Build Lightning Rods and wait for thunderstorms. Also check Traveling Cart Friday/Sunday.","Basalt":"Open Magma Geodes from mine floors 81-119. About 1 in 26 chance.","Coral":"Forage on the beach, especially after stormy/rainy days. Check tidal pool side if bridge repaired.","Snail":"Use Crab Pots in freshwater: river, lake, or mountain lake. Add bait and check next day.","Walleye":"Fall rain, 12 PM to 2 AM, river/lake/forest pond. In Winter use Rain Totem or Traveling Cart.","Catfish":"Spring/Fall rain, river, any time. Also Secret Woods in rain or Traveling Cart.","Rabbit's Foot":"Rabbit in Deluxe Coop, Serpent drop in Skull Cavern, or Traveling Cart.","Cactus Fruit":"Forage in Calico Desert after bus repair.","Coconut":"Forage in Calico Desert after bus repair.","Jade":"Mines/geodes. Best in Crystalarium; trade to Desert Trader on Sundays for Staircases.","Ruby":"Mines/geodes. Trade at Desert Trader for Spicy Eel."};
function $(id){return document.getElementById(id)}
function directText(el,tag){let n=[...el.children].find(c=>c.tagName===tag);return n?n.textContent:""}
function val(node,tag){let n=node?.getElementsByTagName(tag)?.[0];return n?n.textContent:""}
function normalizeId(s){return (s||"").replace(/\(O\)/g,'').replace(/[^0-9]/g,'')}
function itemName(raw){const id=normalizeId(raw); return ITEM_NAMES[id]||raw||"Unknown"}
function iconImg(name,emoji="🌱"){return `<img src="${wiki(name)}" onerror="this.replaceWith(document.createTextNode('${emoji}'))" alt="">`}
function parseDict(xml,tag){const out={}; const root=xml.getElementsByTagName(tag)[0]; if(!root)return out; [...root.getElementsByTagName('item')].forEach(it=>{const key=it.getElementsByTagName('key')[0];const value=it.getElementsByTagName('value')[0]; if(!key||!value)return; const name=(key.getElementsByTagName('string')[0]||key.children[0]||{}).textContent; const count=(value.getElementsByTagName('int')[0]||value.children[0]||{}).textContent||"1"; if(name)out[name]=parseInt(count)||1;}); return out;}
function parseAchievements(xml){let nums=[]; [...xml.getElementsByTagName('achievements')].forEach(root=>{nums.push(...[...root.getElementsByTagName('int')].map(x=>parseInt(x.textContent)).filter(n=>!isNaN(n)));}); return nums;}
function parseMail(xml){const root=xml.getElementsByTagName('mailReceived')[0]; if(!root)return []; return [...root.getElementsByTagName('string')].map(x=>x.textContent).filter(Boolean);}
function parsePonds(xml){const ponds=[]; [...xml.getElementsByTagName('Building')].forEach(b=>{const type=directText(b,'buildingType'); if(!/Fish Pond/i.test(type))return; const pond=b.getElementsByTagName('indoors')[0]||b; let fishType=val(pond,'fishType')||val(pond,'fishTypeId')||val(pond,'netFishType'); let fishCount=val(pond,'fishCount')||val(pond,'currentOccupants')||"0"; let max=val(pond,'maxOccupants')||val(pond,'maxFish')||"10"; let needed=""; const needNode=pond.getElementsByTagName('neededItem')[0]||pond.getElementsByTagName('requestItem')[0]||pond.getElementsByTagName('sign').length?null:null; const candidates=['neededItem','requestItem','neededItemId','requestItemId']; for(const c of candidates){const n=pond.getElementsByTagName(c)[0]; if(n){needed=val(n,'parentSheetIndex')||val(n,'ParentSheetIndex')||val(n,'itemId')||n.textContent.trim(); break;}} let neededCount=val(pond,'neededItemCount')||val(pond,'requestItemCount')||""; ponds.push({type:itemName(fishType), raw:fishType, count:parseInt(fishCount)||0, max:parseInt(max)||10, needed:itemName(needed), neededCount});}); return ponds;}
function percent(a,b){return Math.round((a/Math.max(1,b))*100)}
function statCard(icon,title,value,sub,img){return `<div class="card span3"><div class="stat"><div class="icon">${img?iconImg(img,icon):icon}</div><div><h3>${title}</h3><div class="big">${value}</div><div class="mini">${sub||''}</div></div></div></div>`}
function render(data){
 const crafted=Object.keys(data.crafting).length,cooked=Object.keys(data.cooking).length,books=BOOKS.filter(b=>data.mail.some(f=>f.includes(b.key))).length;
 $('dash').innerHTML=statCard('🏡','Farm',data.farmName||'Unknown',data.playerName||'Player')+statCard('📅','Date',`Y${data.year} ${data.season} ${data.day}`,'Imported save')+statCard('💰','Gold',Number(data.money||0).toLocaleString(),'Current money','Gold')+statCard('🐟','Ponds',data.ponds.length,data.ponds.length?'Detected on farm':'None detected','Fish_Pond')+statCard('🛠️','Crafted',`${crafted}/${CRAFTING.length}`,'Known crafting list','Crafting')+statCard('🍳','Cooked',`${cooked}/${COOKING.length}`,'Known cooking list','Cooking')+statCard('📚','Books',`${books}/${BOOKS.length}`,'Detected book flags')+statCard('🏆','Achievements',`${data.achievements.length}/${STEAM_ACH.length}`,'Detected save achievements');
 renderGoals(data); renderPonds(data.ponds); renderChecklist('crafting','🛠️ Crafted Items',CRAFTING,data.crafting,'crafted item'); renderChecklist('cooking','🍳 Cooking Recipes Made',COOKING,data.cooking,'cooked recipe'); renderLetters(data.mail); renderBooks(data.mail); renderAchievements(data); renderMissingHelp(data);
}
function renderChecklist(id,title,list,map,kind){const done=list.filter(x=>map[x]).length; $(id).innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">${title.split(' ')[0]}</span><span>${title.replace(title.split(' ')[0]+' ','')}</span></h2><p class="mini">${done}/${list.length} complete. Green means already detected in your save.</p><div class="bar"><div class="fill" style="width:${percent(done,list.length)}%"></div></div><br><input class="search" placeholder="Search ${kind}..." oninput="filterCards(this,'${id}List')"><br><br><div class="items" id="${id}List">${list.map(name=>card(name,!!map[name],map[name]?`Completed ${map[name]} time(s)`:guideFor(name),name, map[name]?'✅':'□')).join('')}</div></div>`}
function card(name,done,sub,img,emoji){return `<div class="item ${done?'done':'missing'}" data-name="${name.toLowerCase()}"><div class="itemPic">${img?iconImg(img,emoji):emoji}</div><div><div class="itemTitle">${name}</div><div class="itemSub">${sub}</div>${!done&&HELP[name]?`<div class="help">${HELP[name]}</div>`:''}</div></div>`}
function guideFor(name){if(HELP[name])return HELP[name]; if(COOKING.includes(name))return 'Missing cooked recipe. Check TV Queen of Sauce, villager recipes, or Stardrop Saloon recipes.'; return 'Not detected in save yet.'}
function filterCards(input,listId){const q=input.value.toLowerCase(); [...$(listId).children].forEach(c=>c.style.display=c.dataset.name.includes(q)?'flex':'none')}
function renderPonds(ponds){$('ponds').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🐟</span><span>Fish Pond Dashboard</span></h2><p class="mini">Shows how many ponds were detected, what fish is inside, population level, and the request needed for more growth.</p>${ponds.length?`<div class="ponds">${ponds.map((p,i)=>{let pct=percent(p.count,p.max), need=p.needed&&p.needed!=='Unknown'&&p.needed.length<40; return `<div class="pond"><div class="pondHead"><div class="icon">${iconImg(p.type,'🐟')}</div><div><h3>Pond #${i+1}: ${p.type}</h3><div class="mini">${p.count}/${p.max} population</div></div></div><br><div class="pondMeter"><span style="width:${pct}%"></span></div><p><b>Request:</b> ${need?`<span class="pill warn">${p.neededCount||''} ${p.needed}</span>`:`<span class="pill yes">No active request detected</span>`}</p>${need&&HELP[p.needed]?`<div class="help"><b>How to get ${p.needed}:</b> ${HELP[p.needed]}</div>`:''}</div>`}).join('')}</div>`:`<div class="empty">No fish ponds detected yet.</div>`}</div>`}
function renderLetters(mail){const labels=mail.map(f=>LETTER_LABELS[f]||friendlyFlag(f)); $('letters').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📬</span><span>Letters & Rewards</span></h2><p class="mini">Player-friendly view of important save-file letter/reward flags. Technical mail flag names are translated when known.</p><input class="search" placeholder="Search letters and rewards..." oninput="filterCards(this,'lettersList')"><br><br><div class="items" id="lettersList">${labels.slice(0,180).map((name,i)=>`<div class="item done" data-name="${name.toLowerCase()}"><div class="itemPic">✉️</div><div><div class="itemTitle">${name}</div><div class="itemSub">Detected</div></div></div>`).join('')||'<div class="empty">No letters detected.</div>'}</div></div>`}
function friendlyFlag(f){return f.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase())}
function renderBooks(mail){const rows=BOOKS.map(b=>({name:b.name,img:b.img,hit:mail.some(f=>f.includes(b.key)||f.toLowerCase().includes(b.name.toLowerCase().split(' ')[0]))})); const read=rows.filter(x=>x.hit).length; $('books').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📚</span><span>Books Read</span></h2><p class="mini">Book tracking depends on the book flags saved by Stardew 1.6.</p><div class="bar"><div class="fill" style="width:${percent(read,rows.length)}%"></div></div><br><div class="items">${rows.map(b=>card(b.name,b.hit,b.hit?'Read / detected':'Not detected',b.img,b.hit?'✅':'📘')).join('')}</div></div>`}
function renderAchievements(data){const doneSet=new Set(data.achievements); $('achievements').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🏆</span><span>Steam-Style Achievements</span></h2><p class="mini">Detected achievement IDs from the save file. Mapping can vary; use this as a progress helper toward all 49.</p><div class="bar"><div class="fill" style="width:${percent(data.achievements.length,STEAM_ACH.length)}%"></div></div><br><div class="items">${STEAM_ACH.map((a,i)=>card(a,doneSet.has(i)||doneSet.has(i+1),doneSet.has(i)||doneSet.has(i+1)?'Detected in save':'Not detected yet',a,'🏆')).join('')}</div></div>`}
function renderMissingHelp(data){const important=['Battery Pack','Basalt','Coral','Snail','Catfish','Walleye','Rabbit\'s Foot','Coconut','Cactus Fruit','Jade','Ruby']; $('missing').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🔎</span><span>Missing Item Help Guide</span></h2><p class="mini">Quick hints for commonly forgotten items and fish pond/community center blockers.</p><div class="items">${important.map(n=>`<div class="item"><div class="itemPic">${iconImg(n,'❓')}</div><div><div class="itemTitle">${n}</div><div class="itemSub">${HELP[n]||'Helpful item to track.'}</div></div></div>`).join('')}</div></div>`}
function renderGoals(data){const goals=[]; const spring=data.season==='spring';
 data.ponds.forEach(p=>{if(p.needed&&p.needed!=='Unknown'&&p.needed.length<40)goals.push(['high','🐟',`${p.type} pond needs ${p.neededCount||''} ${p.needed}`,HELP[p.needed]||'Complete this request to raise pond population.']);});
 if(!data.crafting['Lightning Rod'])goals.push(['high','🌩️','Craft Lightning Rod','Needed for Battery Packs after storms. Battery Pack unlocks Crystalarium.']);
 if(!data.crafting['Crystalarium'])goals.push(['mid','💎','Get or craft Crystalarium','Best first use: Jade for Sunday staircases, or Diamond for money/gifts.']);
 if(spring)goals.push(['mid','🍓','Save money for Egg Festival strawberries','Spring 13. Buy Strawberry Seeds there; they are strong Spring income.']);
 if(!data.cooking['Lucky Lunch'])goals.push(['low','🍀','Prepare Lucky Lunch later','Sea Cucumber + Blue Jazz + Tortilla. Great for Skull Cavern.']);
 if(!data.mail.some(x=>/ccBoilerRoom|minecart/i.test(x)))goals.push(['mid','⚙️','Finish Boiler Room / Minecarts if incomplete','Fast travel saves time every day. Check Adventurer Bundle.']);
 if(data.money<25000)goals.push(['low','💰','Build cash reserve','Fishing is good immediate cash; Skull Cavern is better long-term.']);
 $('goals').innerHTML=`<div class="grid"><div class="card span8"><h2 class="visualTitle"><span class="emoji">🎯</span><span>What Should I Do Next?</span></h2><p class="mini">Personalized recommendations from your imported save.</p>${goals.map((g,i)=>`<div class="row goal ${g[0]}"><div><div class="smallcaps">Priority ${i+1}</div><b>${g[1]} ${g[2]}</b><div class="mini">${g[3]}</div></div><span class="pill ${g[0]==='high'?'no':g[0]==='mid'?'blue':'yes'}">${g[0]}</span></div>`).join('')||'<div class="empty">No obvious urgent goals detected.</div>'}</div><div class="card span4"><h2>🧠 Forgetful Mode</h2><p>This dashboard avoids technical save-file words and shows simple next steps.</p><div class="season"><b>Simple rule:</b><br>Finish active pond requests, build utility items, and check exact missing items before selling anything rare.</div><br><div class="season"><b>Skull Cavern tip:</b><br>Use food, coffee, bombs, and staircases. Depth matters more than clearing every floor.</div></div></div>`}
function parseSave(text){const xml=new DOMParser().parseFromString(text,'text/xml'); if(xml.querySelector('parsererror'))throw new Error('XML parse error'); const p=xml.getElementsByTagName('player')[0]||xml; return {playerName:val(p,'name'),farmName:val(p,'farmName'),year:val(xml,'year')||'?',season:val(xml,'season')||'?',day:val(xml,'dayOfMonth')||'?',money:val(p,'money')||val(xml,'money'),crafting:parseDict(xml,'craftingRecipes'),cooking:parseDict(xml,'cookingRecipes'),mail:parseMail(xml),ponds:parsePonds(xml),achievements:parseAchievements(xml)} }
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0]; if(!f)return; try{const data=parseSave(await f.text()); localStorage.setItem('lastImportName',f.name); render(data);}catch(err){alert('Could not parse save file. Select the main farm save file, not SaveGameInfo.'); console.error(err)}});
$('demoBtn').onclick=()=>render({playerName:'Hien',farmName:'Demo Farm',year:'2',season:'spring',day:'1',money:30482,crafting:{Chest:12,'Quality Sprinkler':7,Furnace:4,'Preserves Jar':3,Keg:1,'Lightning Rod':1},cooking:{Salad:4,Sashimi:7,'Fried Eel':1},mail:['guildMember','ccVault','Book_Mystery','Book_PriceCatalogue','wizardJunimoNote'],ponds:[{type:'Lava Eel',count:5,max:10,needed:'Gold Bar',neededCount:'1'},{type:'Blobfish',count:1,max:3,needed:'Coral',neededCount:'2'}],achievements:[1,2,3,18,22,31]});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.tab).classList.add('active')});
render({playerName:'No save imported',farmName:'Import your save file',year:'?',season:'?',day:'?',money:0,crafting:{},cooking:{},mail:[],ponds:[],achievements:[]});
</script>
