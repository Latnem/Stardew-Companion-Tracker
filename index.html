<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stardew Valley Progress Tracker</title>
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#1f2937;--muted:#667085;--line:#d7dde5;--green:#238823;--blue:#2563eb;--red:#b42318;--soft:#f8fafc;--done:#ecfdf3;--miss:#fff}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}header{background:#fff;border-bottom:1px solid var(--line);padding:18px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:24px}.wrap{max-width:1180px;margin:0 auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.fileLabel,button{border:1px solid var(--line);background:#fff;padding:9px 12px;font-weight:700;cursor:pointer;border-radius:0}.primary{background:var(--green)!important;color:white!important;border-color:var(--green)!important}input[type=file]{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.stat,.card{background:#fff;border:1px solid var(--line);padding:14px}.stat .label{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}.stat .value{font-size:23px;font-weight:800;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tab{background:#fff;border:1px solid var(--line);padding:9px 12px;font-weight:800;cursor:pointer}.tab.active{background:#1f2937;color:white;border-color:#1f2937}.search{width:100%;padding:10px;border:1px solid var(--line);font-size:15px;border-radius:0;margin-top:12px}.section{display:none}.section.active{display:block}.summaryRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--soft);border:1px solid var(--line);padding:10px;margin:8px 0}.bar{height:10px;background:#e5e7eb;border:1px solid var(--line);overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:var(--green)}details{border:1px solid var(--line);background:white;margin:8px 0}summary{padding:10px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}.item{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);padding:9px;background:#fff}.item.done{background:var(--done);border-color:#b7e4c7}.item input{margin-top:2px}.itemName{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:2px}.pill{display:inline-block;padding:3px 8px;border:1px solid var(--line);font-weight:800;background:white}.pill.green{background:var(--done);color:#166534;border-color:#bbf7d0}.pill.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}.warn{border:1px solid #fed7aa;background:#fff7ed;padding:10px;margin:10px 0}.code{font-family:Consolas,monospace;font-size:12px;white-space:pre-wrap;background:#0f172a;color:#e5e7eb;padding:10px;max-height:280px;overflow:auto}.miniTitle{font-size:18px;font-weight:900;margin-bottom:8px}@media(max-width:800px){.grid,.items{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>Stardew Valley Progress Tracker</h1><div class="toolbar"><label class="fileLabel primary">Import Save File<input id="saveFile" type="file"></label><span id="status" class="pill">No save imported</span></div></div></header><main class="wrap"><div id="stats" class="grid"></div><div id="tabs" class="tabs"></div><input id="search" class="search" placeholder="Search items, bundles, quests, achievements..."><section id="dashboard" class="section active"></section><section id="bundles" class="section"></section><section id="achievements" class="section"></section><section id="quests" class="section"></section><section id="collections" class="section"></section><section id="villagers" class="section"></section><section id="diagnostics" class="section"></section></main>

];

const fishIds={'128':'Pufferfish','129':'Anchovy','130':'Tuna','131':'Sardine','132':'Bream','136':'Largemouth Bass','137':'Smallmouth Bass','138':'Rainbow Trout','139':'Salmon','140':'Walleye','141':'Perch','142':'Carp','143':'Catfish','144':'Pike','145':'Sunfish','146':'Red Mullet','147':'Herring','148':'Eel','149':'Octopus','150':'Red Snapper','151':'Squid','154':'Sea Cucumber','155':'Super Cucumber','156':'Ghostfish','158':'Stonefish','159':'Crimsonfish','160':'Angler','161':'Ice Pip','162':'Lava Eel','163':'Legend','164':'Sandfish','165':'Scorpion Carp','267':'Flounder','269':'Midnight Carp','698':'Sturgeon','699':'Tiger Trout','700':'Bullhead','701':'Tilapia','702':'Chub','704':'Dorado','705':'Albacore','706':'Shad','707':'Lingcod','708':'Halibut','734':'Woodskip','775':'Glacierfish','795':'Void Salmon','796':'Slimejack','798':'Midnight Squid','799':'Spook Fish','800':'Blobfish','836':'Stingray','837':'Lionfish','838':'Blue Discus','898':'Son of Crimsonfish','899':'Ms. Angler','900':'Legend II','901':'Radioactive Carp','902':'Glacierfish Jr.'};
const mineralIds={'80':'Quartz','86':'Earth Crystal','84':'Frozen Tear','82':'Fire Quartz','60':'Emerald','62':'Aquamarine','64':'Ruby','66':'Amethyst','68':'Topaz','70':'Jade','72':'Diamond','74':'Prismatic Shard','538':'Alamite','539':'Bixite','540':'Baryte','541':'Aerinite','542':'Calcite','543':'Dolomite','544':'Esperite','545':'Fluorapatite','546':'Geminite','547':'Helvite','548':'Jamborite','549':'Jagoite','550':'Kyanite','551':'Lunarite','552':'Malachite','553':'Neptunite','554':'Lemon Stone','555':'Nekoite','556':'Orpiment','557':'Petrified Slime','558':'Thunder Egg','559':'Pyrite','560':'Ocean Stone','561':'Ghost Crystal','562':'Tigerseye','563':'Jasper','564':'Opal','565':'Fire Opal','566':'Celestine','567':'Marble','568':'Sandstone','569':'Granite','570':'Basalt','571':'Limestone','572':'Soapstone','573':'Hematite','574':'Mudstone','575':'Obsidian','576':'Slate','577':'Fairy Stone','578':'Star Shards'};

const fish=Object.values(fishIds).filter((v,i,a)=>a.indexOf(v)===i); const minerals=Object.values(mineralIds); const artifacts=Object.values(artifactIds).filter((v,i,a)=>a.indexOf(v)===i);
const villagers=['Abigail','Alex','Caroline','Clint','Demetrius','Dwarf','Elliott','Emily','Evelyn','George','Gus','Haley','Harvey','Jas','Jodi','Kent','Krobus','Leah','Leo','Lewis','Linus','Marnie','Maru','Pam','Penny','Pierre','Robin','Sam','Sandy','Sebastian','Shane','Vincent','Willy','Wizard'];
function loadManual(){try{state.manual=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch{state.manual={}}}function saveManual(){localStorage.setItem(LS_KEY,JSON.stringify(state.manual))}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function q(s){return document.querySelector(s)}function qa(s){return [...document.querySelectorAll(s)]}function cap(s){return s?String(s)[0].toUpperCase()+String(s).slice(1):''}function textOf(parent,tag){const e=parent?.getElementsByTagName(tag)?.[0];return e?e.textContent:''}function normId(v){v=String(v||'').trim();let m=v.match(/\(O\)(\d+)/)||v.match(/^\d+$/)&&[v,v]||v.match(/(?:^|[^\d])(\d{2,4})(?:$|[^\d])/);return m?m[1]:v}
function dictEntries(tag){const root=state.xml?.getElementsByTagName(tag)?.[0], arr=[]; if(!root) return arr; [...root.children].forEach(it=>{if(it.tagName!=='item')return; const k=it.getElementsByTagName('key')[0], val=it.getElementsByTagName('value')[0]; arr.push({key:k, value:val, keyText:k?.textContent?.trim()||'', valueText:val?.textContent?.trim()||''});});return arr}
function keyIdSet(tag){const s=new Set(); dictEntries(tag).forEach(e=>{const int=e.key?.getElementsByTagName('int')[0]?.textContent; const str=e.key?.getElementsByTagName('string')[0]?.textContent; const id=normId(int||str||e.keyText); if(id) s.add(id)}); return s}
function museumValueIds(){const s=new Set(); dictEntries('museumPieces').forEach(e=>{const int=e.value?.getElementsByTagName('int')[0]?.textContent; const str=e.value?.getElementsByTagName('string')[0]?.textContent; const id=normId(int||str||e.valueText); if(id) s.add(id)});return s}
function parseBundleState(){const map={}; dictEntries('bundles').forEach(e=>{const id=Number(normId(e.key?.getElementsByTagName('int')[0]?.textContent||e.keyText)); const bools=[...e.value.getElementsByTagName('boolean')].map(b=>b.textContent==='true'); if(!Number.isNaN(id)) map[id]=bools}); return map}
function parseSave(text){state.saveText=text;state.xml=new DOMParser().parseFromString(text,'text/xml');const player=state.xml.getElementsByTagName('player')[0], stats=state.xml.getElementsByTagName('stats')[0];state.farm={name:textOf(player,'name')||'Unknown Farmer',farmName:textOf(player,'farmName')||'Unknown Farm',money:textOf(player,'money')||'0',totalMoney:textOf(stats,'totalMoneyEarned')||'',deepest:textOf(player,'deepestMineLevel')||'',year:textOf(state.xml,'year')||'',season:textOf(state.xml,'currentSeason')||'',day:textOf(state.xml,'dayOfMonth')||'',skills:{farming:textOf(player,'farmingLevel'),mining:textOf(player,'miningLevel'),combat:textOf(player,'combatLevel'),fishing:textOf(player,'fishingLevel'),foraging:textOf(player,'foragingLevel')}};const fishSet=keyIdSet('fishCaught'), minSet=keyIdSet('mineralsFound'), artSet=keyIdSet('artifactsFound'), shipSet=keyIdSet('basicShipped'), museumSet=museumValueIds();state.parsed={lower:text.toLowerCase(),fishIds:fishSet,fishNames:new Set([...fishSet].map(id=>fishIds[id]).filter(Boolean)),mineralIds:minSet,mineralNames:new Set([...minSet,...museumSet].map(id=>mineralIds[id]).filter(Boolean)),artifactIds:artSet,artifactNames:new Set([...artSet,...museumSet].map(id=>artifactIds[id]).filter(Boolean)),shippedIds:shipSet,museumIds:museumSet,bundles:parseBundleState(),mail:new Set([...state.xml.getElementsByTagName('mailReceived')].flatMap(x=>[...x.getElementsByTagName('string')].map(s=>s.textContent))),quests:[...state.xml.getElementsByTagName('quest')].map(x=>x.textContent).join('\n').toLowerCase()};}
function k(g,n){return g+'::'+n}function manualDone(g,n){return !!state.manual[k(g,n)]}function setManual(g,n,val){state.manual[k(g,n)]=!!val;saveManual();render()}function cleanName(n){return String(n).replace(/ x\d+/,'').replace(/^Gold /,'').replace(/ Payment$/,'').trim()}
function bundleAuto(item,bundle){const b=state.parsed.bundles?.[bundle.id]; if(!b) return false; const idx=bundle.items.indexOf(item); if(idx>=0) return !!b[idx]; return b.filter(Boolean).length>=bundle.req}
function autoDone(g,n,ctx){if(!state.saveText)return false;const name=cleanName(n); if(g==='Bundles') return bundleAuto(n,ctx); if(g==='Fish')return state.parsed.fishNames.has(name); if(g==='Minerals')return state.parsed.mineralNames.has(name); if(g==='Artifacts')return state.parsed.artifactNames.has(name); if(g==='Quests')return state.parsed.mail.has(name)||state.parsed.quests.includes(name.toLowerCase().split(' ')[0]); if(g==='Achievements')return inferAchievement(name); if(g==='Villagers'){const p=state.xml?.getElementsByTagName('friendshipData')[0]; return p? p.textContent.includes(name):false} return false}
function inferAchievement(name){const f=state.farm,money=Number(f.totalMoney||f.money||0),deep=Number(f.deepest||0),skillVals=Object.values(f.skills||{}).map(Number); if(name==='Greenhorn')return money>=15000;if(name==='Cowpoke')return money>=50000;if(name==='Homesteader')return money>=250000;if(name==='Millionaire')return money>=1000000;if(name==='Legend')return money>=10000000;if(name==='The Bottom')return deep>=120;if(name==='Singular Talent')return skillVals.some(x=>x>=10);if(name==='Master Of The Five Ways')return skillVals.length&&skillVals.every(x=>x>=10);return false}
function isDone(g,n,ctx){return manualDone(g,n)||autoDone(g,n,ctx)}function progressFor(g,items,ctx){let done=items.filter(x=>isDone(g,Array.isArray(x)?x[0]:x,ctx)).length;return{done,total:items.length,pct:items.length?Math.round(done/items.length*100):0}}
function itemHTML(g,n,meta='',ctx=null){const done=isDone(g,n,ctx),auto=autoDone(g,n,ctx),man=manualDone(g,n);return `<label class="item ${done?'done':'missing'}" data-search="${esc((n+' '+meta).toLowerCase())}"><input type="checkbox" ${done?'checked':''} onchange="setManual('${esc(g)}','${esc(n).replace(/'/g,"\\'")}',this.checked)"><div><div class="itemName">${esc(n)}</div><div class="meta">${esc(meta)}${auto?' · save-detected':''}${man&&!auto?' · manual':''}</div></div></label>`}
function detailsHTML(title,g,items,meta='',ctx=null){const p=progressFor(g,items,ctx);return `<details open data-search="${esc((title+' '+items.join(' ')).toLowerCase())}"><summary><span>${esc(title)}</span><span class="pill ${p.done===p.total?'green':'blue'}">${p.done}/${p.total}</span></summary><div class="items">${items.map(x=>itemHTML(g,x,meta,ctx)).join('')}</div></details>`}
function renderStats(){const f=state.farm||{};q('#stats').innerHTML=[['Farmer',f.name||'Not imported'],['Farm',f.farmName||'—'],['Date',f.year?`${cap(f.season)} ${f.day}, Year ${f.year}`:'—'],['Gold',f.money?Number(f.money).toLocaleString()+'g':'—']].map(([a,b])=>`<div class="stat"><div class="label">${a}</div><div class="value">${esc(b)}</div></div>`).join('')}
function dashCard(title,p,txt){return `<div class="stat"><div class="label">${esc(title)}</div><div class="value">${p.done}/${p.total}</div><div class="bar"><span style="width:${p.pct}%"></span></div><div class="meta">${esc(txt)}</div></div>`}
function renderTabs(){const tabs=[['dashboard','Dashboard'],['bundles','Bundles'],['achievements','Achievements'],['quests','Quests'],['collections','Collections'],['villagers','Villagers'],['diagnostics','Diagnostics']];q('#tabs').innerHTML=tabs.map(([id,t])=>`<button class="tab ${id==='dashboard'?'active':''}" onclick="showTab('${id}')">${t}</button>`).join('')}
function showTab(id){qa('.tab').forEach(x=>x.classList.toggle('active',x.textContent.toLowerCase()===id));qa('.section').forEach(x=>x.classList.toggle('active',x.id===id))}
function renderDashboard(){const bp=progressFor('Bundles',bundleData.map(b=>b.bundle));const ap=progressFor('Achievements',achievementData);const fp=progressFor('Fish',fish);const mp=progressFor('Minerals',minerals);q('#dashboard').innerHTML=`<div class="grid">${dashCard('Community Center',bp,'Bundle completion from save bundle booleans.')}${dashCard('Fish Caught',fp,'Detected from fishCaught IDs.')}${dashCard('Minerals',mp,'Detected from mineralsFound + museumPieces.')}${dashCard('Achievements',ap,'Steam is source of truth; some are manual.')}</div><div class="card"><div class="miniTitle">Next Missing Bundle Items</div>${bundleData.map(b=>{const missing=b.items.filter(it=>!isDone('Bundles',it,b));return missing.length?`<div><b>${esc(b.bundle)}</b>: ${missing.map(esc).join(', ')}</div>`:''}).filter(Boolean).slice(0,20).join('')||'No missing bundle items detected.'}</div>`}
function renderBundles(){const rooms=[...new Set(bundleData.map(b=>b.room))];q('#bundles').innerHTML=rooms.map(room=>{const bs=bundleData.filter(b=>b.room===room);return `<div class="card"><div class="miniTitle">${esc(room)}</div>${bs.map(b=>{const count=(state.parsed.bundles?.[b.id]||[]).filter(Boolean).length;return detailsHTML(`${b.bundle} (${count}/${b.req} required)`, 'Bundles', b.items, 'Community Center', b)}).join('')}</div>`}).join('')}
function renderAchievements(){const p=progressFor('Achievements',achievementData);q('#achievements').innerHTML=`<div class="card"><div class="miniTitle">Steam Achievements ${p.done}/${p.total}</div><div class="warn"><b>Steam Library is still the source of truth.</b> The save file does not expose every Steam platform achievement reliably. Use manual ticks here to match Steam.</div>${detailsHTML('All Steam Achievements','Achievements',achievementData)}</div>`}
function renderQuests(){q('#quests').innerHTML=`<div class="card">${detailsHTML('Main / Useful Quest Checklist','Quests',quests)}</div>`}
function renderCollections(){q('#collections').innerHTML=`<div class="card">${detailsHTML('Fish Caught','Fish',fish,'From fishCaught')}${detailsHTML('Minerals Found / Donated','Minerals',minerals,'From mineralsFound + museumPieces')}${detailsHTML('Artifacts Found / Donated','Artifacts',artifacts,'From artifactsFound + museumPieces')}</div>`}
function renderVillagers(){q('#villagers').innerHTML=`<div class="card"><div class="miniTitle">Villagers</div><div class="items">${villagers.map(v=>itemHTML('Villagers',v,'Detected if present in friendshipData')).join('')}</div></div>`}
function renderDiagnostics(){const p=state.parsed||{};const obj={fishIDs:[...(p.fishIds||[])],fishNames:[...(p.fishNames||[])],mineralIDs:[...(p.mineralIds||[])],mineralNames:[...(p.mineralNames||[])],artifactIDs:[...(p.artifactIds||[])],artifactNames:[...(p.artifactNames||[])],museumIDs:[...(p.museumIds||[])],bundleIds:Object.keys(p.bundles||{}),mailCount:p.mail?p.mail.size:0};q('#diagnostics').innerHTML=`<div class="card"><div class="miniTitle">Parser Diagnostics</div><div class="warn">Use this if something looks wrong. It shows what the save file actually exposed to the tracker.</div><div class="code">${esc(JSON.stringify(obj,null,2))}</div></div>`}
function render(){renderStats();renderTabs();renderDashboard();renderBundles();renderAchievements();renderQuests();renderCollections();renderVillagers();renderDiagnostics();applySearch()}
function applySearch(){const term=(q('#search')?.value||'').toLowerCase().trim();qa('[data-search]').forEach(el=>{el.style.display=!term||el.getAttribute('data-search').includes(term)?'':'none'})}
q('#saveFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const text=await file.text();parseSave(text);q('#status').innerHTML=`Imported <b>${esc(file.name)}</b>`;render()});q('#search').addEventListener('input',applySearch);loadManual();render();
</script></body></html>
