function iconCandidates(name){
 const s=String(name||'').trim(); const mapped=ICON_MAP[s]||s;
 const list=[mapped,s];
 if(mapped.includes(':')) list.push(mapped.replaceAll(':',''), mapped.replaceAll(':',' '));

}
function nextIcon(el,emoji){

 }catch(e){}
 el.replaceWith(document.createTextNode(emoji||''));
}

function numVal(root,tags){for(const tag of tags){const e=root.querySelector(tag);if(e){const n=parseInt(e.textContent);if(!isNaN(n))return n}}return 0}
function allNums(root,tags){const nums=[];tags.forEach(tag=>root.querySelectorAll(tag).forEach(e=>{const n=parseInt(e.textContent);if(!isNaN(n))nums.push(n)}));return nums}
function statsFromSave(root,player){
 const money=numVal(player,['totalMoneyEarned','moneyEarned','totalMoney']) || numVal(root,['stats > totalMoneyEarned','totalMoneyEarned']);
 const deepest=numVal(player,['deepestMineLevel']) || numVal(root,['deepestMineLevel']);
 const skillTags=['farmingLevel','miningLevel','combatLevel','foragingLevel','fishingLevel'];
 const skillLevels=skillTags.map(t=>numVal(player,[t]));
 const cookedCount=Object.keys(cookedDict(root)).length;
 const crafting=dictByName(root,'craftingRecipes');
 const craftedCount=Object.values(crafting).filter(v=>parseInt(v)>0).length;
 let fishCaught=0;
 root.querySelectorAll('fishCaught > item').forEach(it=>{
   const v=numVal(it,['value > ArrayOfInt > int','value > int']);
   if(v>0) fishCaught++;
 });
 const fishTotal=allNums(root,['fishCaught > item > value > ArrayOfInt > int','fishCaught > item > value > int']).reduce((a,b)=>a+b,0);
 const donations=root.querySelectorAll('museumPieces > item').length;
 const help=numVal(root,['stats > questsCompleted','questsCompleted','numberOfHelpRequestsCompleted']);
 const house=numVal(player,['houseUpgradeLevel','upgradeLevel']);
 return {money,deepest,skillLevels,cookedCount,craftedCount,fishCaught,fishTotal,donations,help,house};
}
function verifyAchievements(root,player,ids){

 ACH_ORDER.forEach(id=>verified[id]={done:set.has(id),method:set.has(id)?'Achievement ID':'Not detected'});
 const mark=(id,cond,method)=>{ if(cond && verified[id] && !verified[id].done){verified[id]={done:true,method};} };

 mark(4,stats.money>=10000000,'Total money earned ≥ 10,000,000g');

 mark(20,stats.craftedCount>=15,'Crafted items ≥ 15');
 mark(21,stats.craftedCount>=30,'Crafted items ≥ 30');
 mark(24,stats.fishCaught>=10,'Different fish caught ≥ 10');

 mark(28,stats.donations>=40,'Museum donations ≥ 40');

 mark(19,stats.house>=2,'House fully upgraded');
 mark(37,stats.deepest>=120,'Deepest mine level ≥ 120');
 mark(42,stats.skillLevels.some(n=>n>=10),'Any skill level ≥ 10');
 mark(43,stats.skillLevels.filter(n=>n>=10).length>=5,'All five main skills level 10');

function friendlyFlag(f){return String(f).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase())}
function renderBooks(data){const rows=BOOKS.map(b=>({name:b.name,key:b.key,img:b.img,hit:(data.booksRead&&data.booksRead[b.key])||data.mail.some(f=>f.includes(b.key))||isManual('books',b.name),source:(data.booksRead&&data.booksRead[b.key])?'Save stats':(data.mail.some(f=>f.includes(b.key))?'Mail/flag':(isManual('books',b.name)?'Manual':'Not detected'))}));$('books').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📚</span><span>Books Read</span></h2><p class="mini">Book parsing is based on saved book flags when present, with  checkbox support.</p><div class="items">${rows.map(b=>`<div class="item ${b.hit?'done':'missing'} ${isManual('books',b.name)?'':''}" data-name="${b.name.toLowerCase()}"><div class="itemPic">${img(b.img||b.name,'📘')}</div><div><div class="itemTitle">${b.name}</div><div class="itemSub">${b.hit?'Read / detected • '+b.source:'Not detected'}</div><div class="itemSub mono">${b.key}</div></div></div>`).join('')}</div></div>`}
function renderMissing(data){const important=['Battery Pack','Basalt','Coral','Snail','Catfish','Walleye',"Rabbit's Foot",'Coconut','Cactus Fruit','Jade','Ruby'];$('missing').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🔎</span><span>Missing Item Help Guide</span></h2><p class="mini">Quick hints for commonly forgotten items and fish pond/community center blockers.</p><div class="items">${important.map(n=>`<div class="item"><div class="itemPic">${img(n,'❓')}</div><div><div class="itemTitle">${n}</div><div class="itemSub">${HELP[n]||'Helpful item to track.'}</div></div></div>`).join('')}</div></div>`}
function renderManual(){$('').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📝</span><span>Manual Notes & Overrides</span></h2><p class="mini">es are saved only in this browser. They do not modify your Stardew save.</p><textarea id="notes" style="width:100%;min-height:160px;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fffef8" placeholder="Example: Buy strawberries Spring 13, save coral for Blobfish pond...">${localStorage.getItem('stardewNotes')||''}</textarea><br><br><button onclick="localStorage.setItem('stardewNotes',$('notes').value)">Save Notes</button> <button class="secondary" onclick="localStorage.removeItem('stardewNotes');$('notes').value=''">Clear Notes</button></div>`}
function renderGoals(data){const goals=[];data.ponds.forEach(p=>{if(p.needed&&p.needed!=='Unknown'&&p.needed.length<60)goals.push(['high','🐟',`${p.type} pond needs ${p.neededCount||''} ${p.needed}`,HELP[p.needed]||'Complete this request to raise pond population.']);});if(!data.crafting['Lightning Rod'])goals.push(['high','🌩️','Craft Lightning Rod','Needed for Battery Packs after storms.']);if(!data.crafting['Crystalarium'])goals.push(['mid','💎','Get or craft Crystalarium','Best first use: Jade for Sunday staircases, or Diamond for money/gifts.']);if(String(data.season).toLowerCase()==='spring')goals.push(['mid','🍓','Save money for Egg Festival strawberries','Spring 13. Buy Strawberry Seeds there.']);if(!data.cooked['Lucky Lunch'])goals.push(['low','🍀','Prepare Lucky Lunch later','Sea Cucumber + Blue Jazz + Tortilla. Great for Skull Cavern.']);$('goals').innerHTML=`<div class="grid"><div class="card span8"><h2 class="visualTitle"><span class="emoji">🎯</span><span>What Should I Do Next?</span></h2><p class="mini">Personalized recommendations from your imported save.</p>${goals.map((g,i)=>`<div class="row goal ${g[0]}"><div><div class="smallcaps">Priority ${i+1}</div><b>${g[1]} ${g[2]}</b><div class="mini">${g[3]}</div></div><span class="pill ${g[0]==='high'?'no':g[0]==='mid'?'blue':'yes'}">${g[0]}</span></div>`).join('')||'<div class="empty">No urgent goals detected.</div>'}</div><div class="card span4"><h2>🧠 Forgetful Mode</h2><p>The tracker now separates learned vs crafted/cooked and shows  overrides.</p><div class="season"><b>Today:</b><br>${seasonName(data.season)} ${data.day}, Year ${data.year}</div></div></div>`}
function renderDiag(data){$('diag').innerHTML=`<div class="card span12"><h2>⚙️ Parser Diagnostics</h2><p class="mini">Use this when something looks wrong.</p><pre class="diag">${escapeHtml(JSON.stringify({file:data.fileName,player:data.playerName,farm:data.farmName,year:data.year,day:data.day,season:data.season,seasonSource:data.sources.season,achievementIds:data.achievements,rawAchievementCount:data.achievements.length,verifiedAchievementCount:data.achVerified?Object.values(data.achVerified).filter(x=>x.done).length:data.achievements.length,achievementStats:data.achStats,craftingLearned:Object.keys(data.crafting).length,craftingActuallyCrafted:Object.values(data.crafting).filter(v=>parseInt(v)>0).length,cookingLearned:Object.keys(data.cookingLearned).length,cookedDishes:Object.keys(data.cooked).length,mailCount:data.mail.length,booksRead:data.booksRead,bookCount:Object.keys(data.booksRead||{}).length,ponds:data.ponds},null,2))}</pre></div>`}
function escapeHtml(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function filterCards(input,listId){const q=input.value.toLowerCase();[...$(listId).children].forEach(c=>c.style.display=c.dataset.name.includes(q)?'flex':'none')}
function parseSave(text,fileName){const root=new DOMParser().parseFromString(text,'text/xml');if(root.querySelector('parsererror'))throw new Error('XML parse error');const player=root.querySelector('player')||root;const season=firstText(root,['currentSeason','season','seasonForSaveGame']);const year=firstText(root,['year']);const day=firstText(root,['dayOfMonth','day']);const crafting=dictByName(root,'craftingRecipes');const cookingLearned=dictByName(root,'cookingRecipes');const cooked=cookedDict(root);const achIds=achievements(root);const achV=verifyAchievements(root,player,achIds);const statsMap=customStats(root);const booksRead=bookMapFromStats(statsMap);const data={fileName,playerName:direct(player,'name')||txt(player,'name'),farmName:direct(player,'farmName')||txt(player,'farmName'),year:year.value,season:season.value,day:day.value,money:direct(player,'money')||txt(player,'money')||txt(root,'money')||0,crafting,cookingLearned,cooked,statsMap,booksRead,mail:mail(root),ponds:parsePonds(root),achievements:achIds,achVerified:achV.verified,achStats:achV.stats,sources:{season:season.source,year:year.source,day:day.source}};window.lastData=data;return data}
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=parseSave(await f.text(),f.name);localStorage.setItem('lastImportName',f.name);render(data)}catch(err){console.warn('Save import warning:',err)}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.tab).classList.add('active')});
render({fileName:'none',playerName:'No save imported',farmName:'Import save',year:'?',season:'?',day:'?',money:0,crafting:{},cookingLearned:{},cooked:{},statsMap:{},booksRead:{},mail:[],ponds:[],achievements:[],achVerified:{},achStats:{},sources:{season:'not loaded',year:'not loaded',day:'not loaded'}});
</script>
</body>
