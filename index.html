<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stardew Save Sync Tracker</title>
<style>
  :root{
    --bg:#eef2f5;--card:#fff;--ink:#1f2937;--muted:#667085;--line:#d7dde5;
    --green:#238823;--blue:#2563eb;--gold:#b7791f;--red:#c2410c;--purple:#6d28d9;
    --soft:#f8fafc;--done:#ecfdf3;--warn:#fff7ed;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);padding:18px 18px 14px;position:sticky;top:0;z-index:10}
  h1{margin:0;font-size:24px;letter-spacing:-.02em}
  .sub{margin-top:4px;color:var(--muted);font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 0}
  button,.fileLabel{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;font-weight:700;cursor:pointer;border-radius:0;font-size:14px}
  button.primary,.fileLabel.primary{background:var(--green);color:white;border-color:var(--green)}
  button.blue{background:var(--blue);color:white;border-color:var(--blue)}
  button.danger{background:#fff;color:#b42318;border-color:#f2b8b5}
  input[type=file]{display:none}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .stat{background:var(--card);border:1px solid var(--line);padding:14px}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:700}
  .stat .value{font-size:24px;font-weight:800;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);margin-top:14px;padding:14px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tab{background:#fff;border:1px solid var(--line);padding:9px 12px;font-weight:700;cursor:pointer}
  .tab.active{background:#1f2937;color:#fff;border-color:#1f2937}
  .search{width:100%;padding:10px;border:1px solid var(--line);font-size:15px;border-radius:0;margin-top:12px;background:#fff}
  .section{display:none}.section.active{display:block}
  .summaryRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--line);background:var(--soft);padding:10px;margin:8px 0}
  .summaryRow.done{background:var(--done)}
  .bar{height:10px;background:#e5e7eb;border:1px solid var(--line);overflow:hidden;margin-top:6px}
  .bar span{display:block;height:100%;background:var(--green);width:0%}
  details{border:1px solid var(--line);background:#fff;margin:8px 0}
  summary{padding:10px;font-weight:800;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
  .items{padding:0 10px 10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .item{border:1px solid var(--line);padding:8px;background:#fff;display:flex;gap:8px;align-items:flex-start}
  .item.done{background:var(--done);color:#475467}
  .item.missing{background:#fff}
  .item input{margin-top:2px}
  .itemName{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{font-size:12px;font-weight:800;padding:3px 6px;border:1px solid var(--line);background:#fff;white-space:nowrap}
  .pill.green{background:var(--done);color:var(--green);border-color:#b7e4c7}.pill.red{background:#fff1f0;color:#b42318;border-color:#f4c7c3}.pill.blue{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
  .note{font-size:13px;color:var(--muted);line-height:1.45}.warn{background:var(--warn);border:1px solid #fed7aa;padding:10px;margin-top:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .miniTitle{font-size:16px;font-weight:800;margin:0 0 8px}.muted{color:var(--muted)}
  .completedBox{margin-top:12px;border-top:2px solid var(--line);padding-top:10px}
  code{background:#f1f5f9;padding:2px 4px;border:1px solid #e2e8f0}
  @media(max-width:800px){.grid,.two,.three{grid-template-columns:1fr}.items{grid-template-columns:1fr}header{position:static}.wrap{padding:12px}}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>Stardew Save Sync Tracker</h1>
    <div class="toolbar">
      <label class="fileLabel primary" for="saveFile">Import Save File</label>
      <input id="saveFile" type="file" />
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card">
    <div class="miniTitle">Import Save File</div>
    <div class="note">
      Choose the large Stardew save file named exactly like your farm folder, for example <code>MyFarm_123456789</code>. Do not choose <code>SaveGameInfo</code>.
    </div>
    <div id="status" class="warn">No save imported yet.</div>
  </div>

  <section class="grid" id="stats"></section>

  <div class="tabs" id="tabs"></div>
  <input id="search" class="search" placeholder="Search items, bundles, quests, achievements..." />

  <section id="dashboard" class="section active"></section>
  <section id="bundles" class="section"></section>
  <section id="achievements" class="section"></section>
  <section id="quests" class="section"></section>
  <section id="collections" class="section"></section>
  <section id="villagers" class="section"></section>
  <section id="notes" class="section"></section>
</main>

function loadManual(){try{state.manual=JSON.parse(localStorage.getItem(LS_KEY)||'{}')}catch{state.manual={}}}
function saveManual(){localStorage.setItem(LS_KEY,JSON.stringify(state.manual))}
function checkKey(group,name){return group+'::'+name}
function manualDone(group,name){return !!state.manual[checkKey(group,name)]}
function setManual(group,name,val){state.manual[checkKey(group,name)]=!!val;saveManual();render()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function q(sel){return document.querySelector(sel)}
function qa(sel){return [...document.querySelectorAll(sel)]}
function cap(s){return s?String(s).charAt(0).toUpperCase()+String(s).slice(1):''}
function normId(raw){let s=String(raw||'').trim(); let m=s.match(/\(O\)(-?\d+)/); if(m) return m[1]; m=s.match(/^-?\d+$/); if(m) return s; return s;}
function textOf(parent, tag){const el=parent?.getElementsByTagName(tag)?.[0];return el?el.textContent:''}
function allText(tag){return state.xml?[...state.xml.getElementsByTagName(tag)].map(x=>x.textContent):[]}
function directChildren(el, tag){return [...(el?.children||[])].filter(c=>!tag||c.tagName===tag)}
function idsForName(name){let clean=String(name).replace(/^Gold /,'').replace(/ x\d+$/,'').replace(/ Bundle$/,'').trim();return itemIds[clean]||[]}
function dictKeys(tag){const set=new Set(); const els=[...state.xml.getElementsByTagName(tag)];
  els.forEach(dict=>directChildren(dict,'item').forEach(item=>{const key=directChildren(item,'key')[0]; const val=directChildren(item,'value')[0];
    if(key){[...key.getElementsByTagName('*')].forEach(x=>{if(x.children.length===0) set.add(normId(x.textContent));});}
    // also capture value IDs for museumPieces and newer collections
    if(['museumPieces','archaeologyFound','mineralsFound','fishCaught','basicShipped'].includes(tag) && val){[...val.getElementsByTagName('*')].forEach(x=>{if(x.children.length===0) set.add(normId(x.textContent));});}
  }));
  return set;
}
function dictCounts(tag){const map=new Map(); const els=[...state.xml.getElementsByTagName(tag)];
  els.forEach(dict=>directChildren(dict,'item').forEach(item=>{const key=directChildren(item,'key')[0]; const val=directChildren(item,'value')[0]; if(!key) return;
    let id=''; [...key.getElementsByTagName('*')].some(x=>{if(x.children.length===0){id=normId(x.textContent); return true}});
    let count=1; if(val){const leaves=[...val.getElementsByTagName('*')].filter(x=>x.children.length===0).map(x=>x.textContent.trim()).filter(Boolean); const nums=leaves.map(Number).filter(n=>!Number.isNaN(n)); if(nums.length) count=Math.max(...nums);}
    if(id) map.set(id,count);
  })); return map;
}
function parseBundles(){const out={}; const bundles=[...state.xml.getElementsByTagName('bundles')];
  bundles.forEach(dict=>directChildren(dict,'item').forEach(item=>{const key=directChildren(item,'key')[0]; const val=directChildren(item,'value')[0]; let id=''; if(key){[...key.getElementsByTagName('*')].some(x=>{if(x.children.length===0){id=normId(x.textContent);return true}})}; if(!id||!val) return; const bools=[...val.getElementsByTagName('boolean')].map(b=>b.textContent.trim().toLowerCase()==='true'); out[id]=bools;}));
  return out;
}
function parseSave(text){
  state.saveText=text; state.xml=new DOMParser().parseFromString(text,'text/xml'); const player=state.xml.getElementsByTagName('player')[0]; const stats=state.xml.getElementsByTagName('stats')[0];
  state.farm={name:textOf(player,'name')||'Unknown Farmer', farmName:textOf(player,'farmName')||'Unknown Farm', money:textOf(player,'money')||'0', totalMoney:textOf(stats,'totalMoneyEarned')||'', deepest:textOf(player,'deepestMineLevel')||'', year:textOf(state.xml,'year')||'', season:textOf(state.xml,'currentSeason')||'', day:textOf(state.xml,'dayOfMonth')||'', skills:{farming:textOf(player,'farmingLevel'), mining:textOf(player,'miningLevel'), combat:textOf(player,'combatLevel'), fishing:textOf(player,'fishingLevel'), foraging:textOf(player,'foragingLevel')}};
  const mail=new Set(allText('string'));
  const fishSet=dictKeys('fishCaught'), fishCounts=dictCounts('fishCaught');
  const mineralSet=new Set([...dictKeys('mineralsFound'),...dictKeys('basicShipped'),...dictKeys('museumPieces')]);
  const artifactSet=new Set([...dictKeys('archaeologyFound'),...dictKeys('museumPieces')]);
  const shippedSet=dictKeys('basicShipped');
  const bundles=parseBundles();
  state.parsed={mail, fishSet, fishCounts, mineralSet, artifactSet, shippedSet, bundles, questsText: allText('quest').join('\n').toLowerCase(), saveLower:text.toLowerCase(), foundItemNames:new Set()};
  // name fallback only as supplement, never the main source
  Object.keys(itemIds).forEach(name=>{ const ids=itemIds[name]||[]; if(ids.some(id=>fishSet.has(id)||mineralSet.has(id)||artifactSet.has(id)||shippedSet.has(id))) state.parsed.foundItemNames.add(name); });
}
function hasItem(name){const ids=idsForName(name); if(!ids.length) return false; const p=state.parsed||{}; return ids.some(id=>p.fishSet?.has(id)||p.mineralSet?.has(id)||p.artifactSet?.has(id)||p.shippedSet?.has(id));}
function bundleSlotDone(name){const b=bundleData.find(b=>b.items.includes(name)); if(!b) return false; const bools=state.parsed.bundles?.[String(b.id)]; if(!bools) return false; const idx=b.items.indexOf(name); return bools[idx]===true;}
function roomComplete(room){return (bundleRoomMail[room]||[]).some(m=>state.parsed.mail?.has(m))}
function autoDone(group,name){ if(!state.saveText) return false; const clean=String(name).replace(/^Gold /,'').replace(/ x\d+$/,'').replace(/ Bundle$/,'').trim();
  if(group==='Bundles') { const b=bundleData.find(x=>x.items.includes(name)); if(b && roomComplete(b.room)) return true; return bundleSlotDone(name) || hasItem(clean); }
  if(group==='Fish') return idsForName(clean).some(id=>state.parsed.fishSet?.has(id));
  if(group==='Minerals') return idsForName(clean).some(id=>state.parsed.mineralSet?.has(id));
  if(group==='Artifacts') return idsForName(clean).some(id=>state.parsed.artifactSet?.has(id));
  if(group==='Quests') return inferQuest(clean);
  if(group==='Achievements') return inferAchievement(clean);
  return false;
}
function inferQuest(name){const lower=state.parsed.saveLower||'', qtxt=state.parsed.questsText||''; if(name==='To The Bottom?') return Number(state.farm.deepest||0)>=120; if(name==='The Skull Key') return Number(state.farm.deepest||0)>=120 || lower.includes('skullkey'); if(name==='A Winter Mystery') return lower.includes('magnifyingglass')||lower.includes('gotmagnifyingglass'); if(name==='Meet The Wizard') return lower.includes('wizard')&&lower.includes('junimo'); return qtxt.includes(name.toLowerCase().split(' ')[0]);}
function inferAchievement(name){ const f=state.farm, money=Number(f.totalMoney||f.money||0), deepest=Number(f.deepest||0); const fishCaught=state.parsed.fishSet?.size||0; const mineralCount=minerals.filter(x=>autoDone('Minerals',x)).length; const artifactCount=artifacts.filter(x=>autoDone('Artifacts',x)).length;
  if(name==='Greenhorn') return money>=15000; if(name==='Cowpoke') return money>=50000; if(name==='Homesteader') return money>=250000; if(name==='Millionaire') return money>=1000000; if(name==='Legend') return money>=10000000;
  if(name==='The Bottom') return deepest>=120; if(name==='Fisherman') return fishCaught>=10; if(name==='Ol\' Mariner') return fishCaught>=24; if(name==='Master Angler') return fishCaught>=fish.length; if(name==='Treasure Trove') return mineralCount+artifactCount>=40; if(name==='A Complete Collection') return mineralCount>=53 && artifactCount>=41;
  if(name==='Singular Talent') return Object.values(f.skills||{}).some(x=>Number(x)>=10); if(name==='Master Of The Five Ways') return Object.values(f.skills||{}).length && Object.values(f.skills).every(x=>Number(x)>=10); if(name==='Local Legend') return [...(state.parsed.mail||[])].some(m=>String(m).toLowerCase().includes('cc')&&String(m).toLowerCase().includes('complete'));
  return false; }
function isDone(group,name){return manualDone(group,name) || autoDone(group,name)}
function progressFor(group, items){const done=items.filter(x=>isDone(group,Array.isArray(x)?x[0]:x)).length;return {done,total:items.length,pct:items.length?Math.round(done/items.length*100):0}}
function itemHTML(group,name,meta=''){ const done=isDone(group,name), auto=autoDone(group,name), man=manualDone(group,name); const safeGroup=String(group).replace(/'/g,"\\'"); const safeName=String(name).replace(/'/g,"\\'");
  return `<label class="item ${done?'done':'missing'}" data-search="${esc((name+' '+meta).toLowerCase())}"><input type="checkbox" ${done?'checked':''} onchange="setManual('${safeGroup}','${safeName}',this.checked)" /><div><div class="itemName">${esc(name)}</div><div class="meta">${esc(meta)}${auto?' · auto-detected':''}${man&&!auto?' · manual':''}</div></div></label>`; }
function detailsHTML(title, group, items, meta=''){const p=progressFor(group,items); return `<details open data-search="${esc((title+' '+items.join(' ')).toLowerCase())}"><summary><span>${esc(title)}</span><span class="pill ${p.done===p.total?'green':'blue'}">${p.done}/${p.total}</span></summary><div class="items">${items.map(x=>itemHTML(group,x,meta)).join('')}</div></details>`}
function renderStats(){ const f=state.farm||{}; const stats=[['Farmer', f.name||'Not imported'], ['Farm', f.farmName||'—'], ['Date', f.year?`${cap(f.season)} ${f.day}, Year ${f.year}`:'—'], ['Gold', f.money?Number(f.money).toLocaleString()+'g':'—'], ['Deepest Mine', f.deepest||'—'], ['Farming', f.skills?.farming??'—'], ['Mining', f.skills?.mining??'—'], ['Fishing', f.skills?.fishing??'—']]; q('#stats').innerHTML=stats.map(([a,b])=>`<div class="stat"><div class="label">${esc(a)}</div><div class="value">${esc(b)}</div></div>`).join('');}
function renderTabs(){ const tabs=[['dashboard','Dashboard'],['bundles','Bundles'],['achievements','Achievements'],['quests','Quests'],['collections','Collections'],['villagers','Villagers'],['notes','Notes']]; q('#tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${id==='dashboard'?'active':''}" data-tab="${id}">${label}</button>`).join(''); qa('.tab').forEach(btn=>btn.onclick=()=>{qa('.tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');qa('.section').forEach(s=>s.classList.remove('active'));q('#'+btn.dataset.tab).classList.add('active')}); }
function dashCard(title,p,desc){return `<div class="card"><div class="summaryRow ${p.done===p.total?'done':''}"><div><b>${esc(title)}</b><div class="note">${esc(desc)}</div><div class="bar"><span style="width:${p.pct}%"></span></div></div><span class="pill ${p.done===p.total?'green':'blue'}">${p.done}/${p.total}</span></div></div>`}
function renderDashboard(){ const bundleItems=bundleData.flatMap(b=>b.items), bp=progressFor('Bundles',bundleItems), ap=progressFor('Achievements',achievementData.map(a=>a[0])), qp=progressFor('Quests',questData.map(q=>q[0])), mp=progressFor('Minerals',minerals), fp=progressFor('Fish',fish); q('#dashboard').innerHTML=`<div class="two">${dashCard('Community Center',bp,'Bundle slots detected from save where available.')}${dashCard('Achievements',ap,'Steam is final source; tracker auto-detects what the save proves.')}${dashCard('Fish Caught',fp,'Read from fishCaught save data.')}${dashCard('Minerals',mp,'Read from minerals/museum save data.')}</div><div class="card"><div class="miniTitle">Recommended next steps</div><div class="items">${itemHTML('Goals','Build Lightning Rod for Battery Pack','Crystalarium goal')}${itemHTML('Goals','Use Jade in Crystalarium later','Trade Jade for Staircases on Sundays')}${itemHTML('Goals','Keep Lava Eel and Blobfish ponds growing','Passive income')}${itemHTML('Goals','Check Traveling Cart Friday and Sunday','Rabbit Foot / Catfish / Walleye / Battery Pack')}${itemHTML('Goals','Prepare Skull Cavern supplies','Food, bombs, coffee, staircases')}${itemHTML('Goals','Save for Strawberry Seeds on Spring 13','Egg Festival')}</div></div>`;}
function renderBundles(){ const rooms=[...new Set(bundleData.map(b=>b.room))]; q('#bundles').innerHTML=rooms.map(room=>{const bs=bundleData.filter(b=>b.room===room), all=bs.flatMap(b=>b.items), p=progressFor('Bundles',all); return `<div class="card" data-search="${esc(room.toLowerCase())}"><div class="summaryRow ${p.done===p.total?'done':''}"><div><b>${esc(room)}</b><div class="bar"><span style="width:${p.pct}%"></span></div></div><span class="pill ${p.done===p.total?'green':'blue'}">${p.done}/${p.total}</span></div>${bs.map(b=>detailsHTML(b.bundle,'Bundles',b.items)).join('')}</div>`}).join('');}
function renderAchievements(){ const p=progressFor('Achievements',achievementData.map(a=>a[0])); q('#achievements').innerHTML=`<div class="card"><div class="miniTitle">Steam Achievements</div><div class="warn"><b>Important:</b> Steam is still the source of truth. This tracker auto-detects achievements that can be proven from the save file, but some Steam achievements may need manual ticking.</div><div class="summaryRow"><div><b>Checked in tracker</b><div class="bar"><span style="width:${p.pct}%"></span></div></div><span class="pill blue">${p.done}/${p.total}</span></div>${detailsHTML('All Steam Achievements','Achievements',achievementData.map(a=>a[0]))}</div>`}
function renderQuests(){q('#quests').innerHTML=`<div class="card">${detailsHTML('Main Quests / Important Goals','Quests',questData.map(a=>a[0]))}</div>`}
function renderCollections(){q('#collections').innerHTML=`<div class="three"><div class="card">${detailsHTML('Minerals','Minerals',minerals)}</div><div class="card">${detailsHTML('Artifacts','Artifacts',artifacts)}</div><div class="card">${detailsHTML('Fish','Fish',fish)}</div></div>`}
function renderVillagers(){q('#villagers').innerHTML=`<div class="card"><div class="miniTitle">Villager Tracker</div><div class="note">Use manual checks for now. A later version can read exact friendship values.</div><div class="items">${villagers.map(v=>itemHTML('Villagers',v,'Met / friendship tracking')).join('')}</div></div>`}
function renderNotes(){ const p=state.parsed||{}; q('#notes').innerHTML=`<div class="card"><div class="miniTitle">Save File Tip</div><p class="note"><b>Best file:</b> choose the large file named exactly like the farm folder, for example <code>MyFarm_123456789</code>. Do not choose <code>SaveGameInfo</code>.</p>${state.saveText?`<div class="warn"><b>Parser diagnostics:</b><br>Fish IDs detected: ${p.fishSet?.size||0}<br>Mineral IDs detected: ${p.mineralSet?.size||0}<br>Artifact IDs detected: ${p.artifactSet?.size||0}<br>Bundle records detected: ${Object.keys(p.bundles||{}).length}</div>`:''}</div>`}
function render(){renderStats();renderTabs();renderDashboard();renderBundles();renderAchievements();renderQuests();renderCollections();renderVillagers();renderNotes();applySearch()}
function applySearch(){const s=q('#search').value.trim().toLowerCase();qa('[data-search]').forEach(el=>{el.style.display=!s||el.dataset.search.includes(s)?'':'none'})}
q('#search').addEventListener('input',applySearch);
async function importFile(file){if(!file) return; const text=await file.text(); parseSave(text); q('#status').innerHTML=`Imported <b>${esc(file.name)}</b>. Checkboxes now use save IDs where available, plus manual checks for anything Steam-only.`; render();}
q('#saveFile').addEventListener('change',e=>importFile(e.target.files[0]));
loadManual();render();
</script>
