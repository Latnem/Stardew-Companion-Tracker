const HELP={"Battery Pack":"Craft Lightning Rods and wait for thunderstorms. Also check Traveling Cart Friday/Sunday.","Basalt":"Open Magma Geodes from mine floors 81-119. About 1 in 26 chance.","Coral":"Forage on the beach. Also check the tide pool side after bridge repair.","Snail":"Use Crab Pots in freshwater: river, lake, or mountain lake. Add bait and check next day.","Walleye":"Fall rain, 12 PM to 2 AM, river/lake/forest pond. In Winter use Rain Totem or Traveling Cart.","Catfish":"Spring/Fall rain, river, any time. Also Secret Woods in rain or Traveling Cart.","Rabbit's Foot":"Rabbit in Deluxe Coop, Serpent drop in Skull Cavern, or Traveling Cart.","Cactus Fruit":"Forage in Calico Desert after bus repair.","Coconut":"Forage in Calico Desert after bus repair.","Jade":"Mines/geodes. Best in Crystalarium; trade to Desert Trader on Sundays for Staircases.","Ruby":"Mines/geodes. Trade at Desert Trader for Spicy Eel."};
const $=id=>document.getElementById(id);const q=(node,sel)=>node?node.querySelector(sel):null;const txt=(node,sel)=>{let e=q(node,sel);return e?e.textContent:null};
function direct(node,tag){if(!node)return null;for(const c of node.children){if(c.tagName===tag)return c.textContent}return null}
function firstText(root,tags){for(const tag of tags){const e=root.querySelector(tag);if(e&&e.textContent!==null&&e.textContent!=="")return {value:e.textContent,source:tag}}return {value:"?",source:"not found"}}
function seasonName(raw){raw=String(raw||'').toLowerCase();if(raw==='0')raw='spring';if(raw==='1')raw='summer';if(raw==='2')raw='fall';if(raw==='3')raw='winter';return {spring:'🌱 Spring',summer:'☀️ Summer',fall:'🍂 Fall',winter:'❄️ Winter'}[raw]||'❓ Unknown'}
function img(name,emoji="🌱"){return `<img src="${wiki(name)}" onerror="this.replaceWith(document.createTextNode('${emoji}'))" alt="">`}
function normId(s){return String(s||'').replace(/\(O\)/g,'').replace(/[^0-9]/g,'')}
function itemName(raw){const id=normId(raw);return ITEM_NAMES[id]||raw||"Unknown"}
function dictByName(root,tag){const out={};const r=root.querySelector(tag);if(!r)return out;r.querySelectorAll(':scope > item').forEach(it=>{const k=txt(it,'key > string')||txt(it,'key > int')||txt(it,'key > unsignedInt');const v=txt(it,'value > int')||txt(it,'value > unsignedInt')||txt(it,'value > boolean')||'0';if(k)out[k]=isNaN(parseInt(v))?v:parseInt(v)});return out}
function cookedDict(root){const raw=dictByName(root,'recipesCooked');const out={};Object.entries(raw).forEach(([id,count])=>{out[COOKED_ID[id]||`Unknown cooked item ${id}`]=count});return out}
function achievements(root){return [...root.querySelectorAll('achievements > int')].map(e=>parseInt(e.textContent)).filter(n=>!isNaN(n))}
function mail(root){return [...root.querySelectorAll('mailReceived > string')].map(e=>e.textContent).filter(Boolean)}
function parsePonds(root){const ponds=[];root.querySelectorAll('Building').forEach(b=>{const type=direct(b,'buildingType');if(!/Fish Pond/i.test(type||''))return;const fishRaw=txt(b,'fishType > int')||direct(b,'fishType')||'';const count=parseInt(direct(b,'currentOccupants')||txt(b,'fishCount > int')||'0')||0;const max=parseInt(direct(b,'maxOccupants')||txt(b,'maxFish > int')||'10')||10;const gate=txt(b,'lastUnlockedPopulationGate > int')||'';const completed=txt(b,'hasCompletedRequest > boolean')==='true';const neededNode=q(b,'neededItem Item');let neededName='',neededId='',neededCount='';if(neededNode){neededName=direct(neededNode,'name')||'';neededId=direct(neededNode,'itemId')||direct(neededNode,'parentSheetIndex')||'';neededCount=txt(b,'neededItemCount > int')||''}ponds.push({type:itemName(fishRaw),fishId:normId(fishRaw),count,max,gate,completed,needed:neededName||itemName(neededId),neededId,neededCount})});return ponds}
function cardCls(state){return state==='done'?'done':state==='partial'?'partial':'missing'}function statusPill(label,cls){return `<span class="pill ${cls}">${label}</span>`}
function manualKey(section,name){return `stardewManual:${section}:${name}`}
function isManual(section,name){return localStorage.getItem(manualKey(section,name))==='1'}
function setManual(section,name,checked){checked?localStorage.setItem(manualKey(section,name),'1'):localStorage.removeItem(manualKey(section,name))}
function pct(a,b){return Math.round((a/Math.max(1,b))*100)}
function stat(icon,title,value,sub,image){return `<div class="card span3"><div class="stat"><div class="icon">${image?img(image,icon):icon}</div><div><h3>${title}</h3><div class="big">${value}</div><div class="mini">${sub||''}</div></div></div></div>`}
function render(data){const craftedDone=CRAFTING.filter(n=>(data.crafting[n]||0)>0 || isManual('crafting',n)).length;const craftedLearned=CRAFTING.filter(n=>data.crafting[n]!==undefined).length;const cookedDone=COOKING.filter(n=>(data.cooked[n]||0)>0 || isManual('cooking',n)).length;const cookingLearned=COOKING.filter(n=>data.cookingLearned[n]!==undefined).length;const bookDone=BOOKS.filter(b=>data.mail.some(f=>f.includes(b.key))||isManual('books',b.name)).length;const achDone=data.achievements.length;
$('dash').innerHTML=stat('🏡','Farm',data.farmName||'Unknown',data.playerName||'Player')+stat('📅','Date',`${seasonName(data.season)} ${data.day}, Year ${data.year}`,`season source: ${data.sources.season}`)+stat('💰','Gold',Number(data.money||0).toLocaleString(),'Current money','Gold')+stat('🐟','Ponds',data.ponds.length,data.ponds.length?'Detected on farm':'None detected','Fish_Pond')+stat('🛠️','Crafting',`${craftedDone}/${CRAFTING.length}`,`${craftedLearned} learned • ${craftedDone} crafted`)+stat('🍳','Cooking',`${cookedDone}/${COOKING.length}`,`${cookingLearned} learned • ${cookedDone} cooked`)+stat('📚','Books',`${bookDone}/${BOOKS.length}`,'Manual allowed')+stat('🏆','Achievements',`${achDone}/49`,'from local save XML');renderGoals(data);renderPonds(data);renderCrafting(data);renderCooking(data);renderLetters(data);renderBooks(data);renderAchievements(data);renderMissing(data);renderManual();renderDiag(data)}
function renderCrafting(data){const learned=CRAFTING.filter(n=>data.crafting[n]!==undefined).length,done=CRAFTING.filter(n=>(data.crafting[n]||0)>0 || isManual('crafting',n)).length;$('crafting').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🛠️</span><span>Crafting: Learned vs Crafted</span></h2><p class="mini">Important: learned recipe and actually crafted are different in the save. Count 0 means learned but never crafted.</p><div class="legend">${statusPill('Learned + Crafted','yes')}${statusPill('Learned Only','warn')}${statusPill('Not Learned','no')}${statusPill('Manual Override','blue')}</div><div class="countGrid"><div class="countBox"><b>${learned}</b>Learned</div><div class="countBox"><b>${done}</b>Crafted/Manual</div><div class="countBox"><b>${CRAFTING.length-done}</b>Not crafted yet</div></div><input class="search" placeholder="Search crafting..." oninput="filterCards(this,'craftList')"><br><br><div class="items" id="craftList">${CRAFTING.map(n=>recipeCard('crafting',n,data.crafting[n])).join('')}</div></div>`}
function renderCooking(data){const learned=COOKING.filter(n=>data.cookingLearned[n]!==undefined).length,done=COOKING.filter(n=>(data.cooked[n]||0)>0 || isManual('cooking',n)).length;$('cooking').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🍳</span><span>Cooking: Learned vs Cooked</span></h2><p class="mini">This uses cookingRecipes for learned recipes and recipesCooked for actual cooked dishes.</p><div class="legend">${statusPill('Learned + Cooked','yes')}${statusPill('Learned Only','warn')}${statusPill('Not Learned','no')}${statusPill('Manual Override','blue')}</div><div class="countGrid"><div class="countBox"><b>${learned}</b>Learned</div><div class="countBox"><b>${done}</b>Cooked/Manual</div><div class="countBox"><b>${COOKING.length-done}</b>Not cooked yet</div></div><input class="search" placeholder="Search cooking..." oninput="filterCards(this,'cookList')"><br><br><div class="items" id="cookList">${COOKING.map(n=>recipeCard('cooking',n,data.cooked[n],data.cookingLearned[n]!==undefined)).join('')}</div></div>`}
function recipeCard(section,name,count,learnedOverride){let learned=(section==='crafting')?count!==undefined:learnedOverride;let completed=(parseInt(count)||0)>0||isManual(section,name);let state=completed?'done':learned?'partial':'missing';let sub=completed?`${section==='crafting'?'Crafted':'Cooked'} ${parseInt(count)||0} time(s)${isManual(section,name)?' • manual':''}`:learned?'Learned, but not completed yet':'Not learned yet';return `<div class="item ${cardCls(state)} ${isManual(section,name)?'manual':''}" data-name="${name.toLowerCase()}"><div class="itemPic">${img(name,completed?'✅':'□')}</div><div><div class="itemTitle">${name}</div><div class="itemSub">${learned?statusPill('Learned','purple'):statusPill('Not learned','no')} ${completed?statusPill(section==='crafting'?'Crafted':'Cooked','yes'):statusPill(section==='crafting'?'Not crafted':'Not cooked','warn')}</div><div class="itemSub">${sub}</div><label class="manualBox"><input type="checkbox" ${isManual(section,name)?'checked':''} onchange="setManual('${section}', '${name.replace(/'/g,"\\'")}', this.checked); if(window.lastData)render(window.lastData)"> Manual checkbox</label>${!completed&&!learned?`<div class="help">${section==='cooking'?'Find recipe from TV, mail, friendship, shop, or festival.':'Learn this recipe from skills, shops, quests, mail, or special unlocks.'}</div>`:''}</div></div>`}
function renderPonds(data){const ponds=data.ponds;$('ponds').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🐟</span><span>Fish Pond Dashboard</span></h2><p class="mini">Now reads the actual FishPond building fields: fishType, currentOccupants, maxOccupants, neededItem, and neededItemCount.</p>${ponds.length?`<div class="ponds">${ponds.map((p,i)=>{const need=p.needed&&p.needed!=='Unknown'&&p.needed.length<60;return `<div class="pond"><div class="pondHead"><div class="icon">${img(p.type,'🐟')}</div><div><h3>Pond #${i+1}: ${p.type}</h3><div class="mini">Fish ID ${p.fishId||'?'} • Gate ${p.gate||'?'}</div></div></div><br><div class="pondMeter"><span style="width:${pct(p.count,p.max)}%"></span></div><p><b>Population:</b> ${p.count}/${p.max}</p><p><b>Status:</b> ${need?statusPill('Waiting for request item','warn'):statusPill('Growing / no request detected','yes')}</p><p><b>Request:</b> ${need?statusPill(`${p.neededCount||''} ${p.needed}`,'no'):'None detected'}</p>${need&&HELP[p.needed]?`<div class="help"><b>How to get ${p.needed}:</b> ${HELP[p.needed]}</div>`:''}</div>`}).join('')}</div>`:'<div class="empty">No fish ponds detected.</div>'}</div>`}
function renderAchievements(data){const set=new Set(data.achievements);const unmapped=data.achievements.filter(id=>!ACH[id]);$('achievements').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🏆</span><span>Achievements</span></h2><p class="mini">Fixed: this no longer guesses by array position. It uses achievement IDs saved in your XML.</p><div class="bar"><div class="fill" style="width:${pct(data.achievements.length,49)}%"></div></div><div class="countGrid"><div class="countBox"><b>${data.achievements.length}</b>Detected in save</div><div class="countBox"><b>49</b>Total tracked</div><div class="countBox"><b>${unmapped.length}</b>Unmapped IDs</div></div><div class="help">If Steam shows more than this save file, Steam has achievement state outside the local save XML. This tracker reports what the save file actually contains.</div><br><div class="items">${ACH_ORDER.map(id=>{let done=set.has(id),name=ACH[id]||`Achievement ID ${id}`;return `<div class="item ${done?'done':'missing'}" data-name="${name.toLowerCase()}"><div class="itemPic">🏆</div><div><div class="itemTitle">${name}</div><div class="itemSub">ID ${id} • ${done?'Detected in save':'Not detected in save'}</div></div></div>`}).join('')}</div></div>`}
function renderLetters(data){let labels=data.mail.map(f=>LETTER_LABELS[f]||friendlyFlag(f));$('letters').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📬</span><span>Letters & Rewards</span></h2><p class="mini">Renamed from mail flags. These are letters, rewards, introductions, and event states saved by Stardew.</p><input class="search" placeholder="Search letters and rewards..." oninput="filterCards(this,'lettersList')"><br><br><div class="items" id="lettersList">${labels.slice(0,250).map(n=>`<div class="item done" data-name="${n.toLowerCase()}"><div class="itemPic">✉️</div><div><div class="itemTitle">${n}</div><div class="itemSub">Detected in save</div></div></div>`).join('')||'<div class="empty">No letters detected.</div>'}</div></div>`}
const LETTER_LABELS={guildMember:"Adventurer's Guild unlocked",wizardJunimoNote:"Wizard invitation / Community Center magic",hasRustyKey:"Sewer Key received",MagnifyingGlass:"Magnifying Glass unlocked",ccPantry:"Pantry completed",ccBoilerRoom:"Boiler Room completed",ccFishTank:"Fish Tank completed",ccCraftsRoom:"Crafts Room completed",ccBulletin:"Bulletin Board completed",ccVault:"Vault progress detected",ccVaultComplete:"Vault completed"};
function friendlyFlag(f){return String(f).replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase())}
function renderBooks(data){const rows=BOOKS.map(b=>({name:b.name,img:b.img,hit:data.mail.some(f=>f.includes(b.key))||isManual('books',b.name)}));$('books').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📚</span><span>Books Read</span></h2><p class="mini">Book parsing is based on saved book flags when present, with manual checkbox support.</p><div class="items">${rows.map(b=>`<div class="item ${b.hit?'done':'missing'} ${isManual('books',b.name)?'manual':''}" data-name="${b.name.toLowerCase()}"><div class="itemPic">${img(b.img,'📘')}</div><div><div class="itemTitle">${b.name}</div><div class="itemSub">${b.hit?'Read / detected':'Not detected'}</div><label class="manualBox"><input type="checkbox" ${isManual('books',b.name)?'checked':''} onchange="setManual('books','${b.name.replace(/'/g,"\\'")}',this.checked); if(window.lastData)render(window.lastData)"> Manual checkbox</label></div></div>`).join('')}</div></div>`}
function renderMissing(data){const important=['Battery Pack','Basalt','Coral','Snail','Catfish','Walleye',"Rabbit's Foot",'Coconut','Cactus Fruit','Jade','Ruby'];$('missing').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🔎</span><span>Missing Item Help Guide</span></h2><p class="mini">Quick hints for commonly forgotten items and fish pond/community center blockers.</p><div class="items">${important.map(n=>`<div class="item"><div class="itemPic">${img(n,'❓')}</div><div><div class="itemTitle">${n}</div><div class="itemSub">${HELP[n]||'Helpful item to track.'}</div></div></div>`).join('')}</div></div>`}
function renderManual(){$('manual').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📝</span><span>Manual Notes & Overrides</span></h2><p class="mini">Manual checkboxes are saved only in this browser. They do not modify your Stardew save.</p><textarea id="notes" style="width:100%;min-height:160px;border:2px solid var(--line);border-radius:12px;padding:12px;background:#fffef8" placeholder="Example: Buy strawberries Spring 13, save coral for Blobfish pond...">${localStorage.getItem('stardewNotes')||''}</textarea><br><br><button onclick="localStorage.setItem('stardewNotes',$('notes').value)">Save Notes</button> <button class="secondary" onclick="localStorage.removeItem('stardewNotes');$('notes').value=''">Clear Notes</button></div>`}
function renderGoals(data){const goals=[];data.ponds.forEach(p=>{if(p.needed&&p.needed!=='Unknown'&&p.needed.length<60)goals.push(['high','🐟',`${p.type} pond needs ${p.neededCount||''} ${p.needed}`,HELP[p.needed]||'Complete this request to raise pond population.']);});if(!data.crafting['Lightning Rod'])goals.push(['high','🌩️','Craft Lightning Rod','Needed for Battery Packs after storms.']);if(!data.crafting['Crystalarium'])goals.push(['mid','💎','Get or craft Crystalarium','Best first use: Jade for Sunday staircases, or Diamond for money/gifts.']);if(String(data.season).toLowerCase()==='spring')goals.push(['mid','🍓','Save money for Egg Festival strawberries','Spring 13. Buy Strawberry Seeds there.']);if(!data.cooked['Lucky Lunch'])goals.push(['low','🍀','Prepare Lucky Lunch later','Sea Cucumber + Blue Jazz + Tortilla. Great for Skull Cavern.']);$('goals').innerHTML=`<div class="grid"><div class="card span8"><h2 class="visualTitle"><span class="emoji">🎯</span><span>What Should I Do Next?</span></h2><p class="mini">Personalized recommendations from your imported save.</p>${goals.map((g,i)=>`<div class="row goal ${g[0]}"><div><div class="smallcaps">Priority ${i+1}</div><b>${g[1]} ${g[2]}</b><div class="mini">${g[3]}</div></div><span class="pill ${g[0]==='high'?'no':g[0]==='mid'?'blue':'yes'}">${g[0]}</span></div>`).join('')||'<div class="empty">No urgent goals detected.</div>'}</div><div class="card span4"><h2>🧠 Forgetful Mode</h2><p>The tracker now separates learned vs crafted/cooked and shows manual overrides.</p><div class="season"><b>Today:</b><br>${seasonName(data.season)} ${data.day}, Year ${data.year}</div></div></div>`}
function renderDiag(data){$('diag').innerHTML=`<div class="card span12"><h2>⚙️ Parser Diagnostics</h2><p class="mini">Use this when something looks wrong.</p><pre class="diag">${escapeHtml(JSON.stringify({file:data.fileName,player:data.playerName,farm:data.farmName,year:data.year,day:data.day,season:data.season,seasonSource:data.sources.season,achievementIds:data.achievements,achievementCount:data.achievements.length,craftingLearned:Object.keys(data.crafting).length,craftingActuallyCrafted:Object.values(data.crafting).filter(v=>parseInt(v)>0).length,cookingLearned:Object.keys(data.cookingLearned).length,cookedDishes:Object.keys(data.cooked).length,mailCount:data.mail.length,ponds:data.ponds},null,2))}</pre></div>`}
function escapeHtml(s){return s.replace(/[&<>]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))}
function filterCards(input,listId){const q=input.value.toLowerCase();[...$(listId).children].forEach(c=>c.style.display=c.dataset.name.includes(q)?'flex':'none')}
function parseSave(text,fileName){const root=new DOMParser().parseFromString(text,'text/xml');if(root.querySelector('parsererror'))throw new Error('XML parse error');const player=root.querySelector('player')||root;const season=firstText(root,['currentSeason','season','seasonForSaveGame']);const year=firstText(root,['year']);const day=firstText(root,['dayOfMonth','day']);const crafting=dictByName(root,'craftingRecipes');const cookingLearned=dictByName(root,'cookingRecipes');const cooked=cookedDict(root);const data={fileName,playerName:direct(player,'name')||txt(player,'name'),farmName:direct(player,'farmName')||txt(player,'farmName'),year:year.value,season:season.value,day:day.value,money:direct(player,'money')||txt(player,'money')||txt(root,'money')||0,crafting,cookingLearned,cooked,mail:mail(root),ponds:parsePonds(root),achievements:achievements(root),sources:{season:season.source,year:year.source,day:day.source}};window.lastData=data;return data}
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=parseSave(await f.text(),f.name);localStorage.setItem('lastImportName',f.name);render(data)}catch(err){alert('Could not parse save file. Select the main farm save file, not SaveGameInfo.');console.error(err)}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.tab).classList.add('active')});
render({fileName:'none',playerName:'No save imported',farmName:'Import your save file',year:'?',season:'?',day:'?',money:0,crafting:{},cookingLearned:{},cooked:{},mail:[],ponds:[],achievements:[],sources:{season:'not loaded',year:'not loaded',day:'not loaded'}});
</script>
</body>
</html>
