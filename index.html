<style>

.stat{display:flex;gap:12px;align-items:center}.icon{width:52px;height:52px;border-radius:13px;background:#f2db9f;border:2px solid #bd8f36;display:grid;place-items:center;font-size:28px;overflow:hidden}.icon img,.itemPic img{width:100%;height:100%;object-fit:contain}.stat h3{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.big{font-size:24px;font-weight:900}.mini{font-size:12px;color:var(--muted);line-height:1.38}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;background:rgba(243,223,173,.94);backdrop-filter:blur(6px);padding:8px;border-radius:14px}.tab{background:#fff7e5;color:#3b2a16;border:2px solid var(--line);box-shadow:none}.tab.active{background:#4b7fa8;color:white;border-color:#315d7e}.section{display:none}.section.active{display:block}.bar{height:14px;background:#ead4a4;border:1px solid #c29d59;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#8bd15c,#40863c);width:0%}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #ecd7a9;padding:10px 0}.row:last-child{border-bottom:0}.pill{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:900;white-space:nowrap}.yes{background:#dff4d8;color:#246b2a}.no{background:#f7d9d2;color:#8d2b1e}.warn{background:#fff0b8;color:#855a00}.blue{background:#dbeeff;color:#22557d}.purple{background:#eadfff;color:#5c3d84}.manual{background:#e3eeff;color:#1f4d77}.learned{background:#e8f2ff;color:#23547d}.search{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:10px;background:#fffef8;font-size:15px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.item{background:#fffdf5;border:1px solid #e3c88d;border-radius:13px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-height:76px;position:relative}.item.done{background:#eef9e9;border-color:#9ed48a}.item.learnedOnly{background:# a{color:#2f6d9d;text-decoration:none;font-weight:800}.smallcaps{text-transform:uppercase;letter-spacing:.4px;font-size:11px;color:var(--muted);font-weight:800}.footer{text-align:center;color:#6d5738;font-size:12px;padding:28px}.season{background:#fff3cc;border:2px dashed #d5a246;border-radius:14px;padding:12px}.visualTitle{display:flex;gap:10px;align-items:center;margin:0 0 10px}.visualTitle .emoji{font-size:30px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.debug{font-family:Consolas,monospace;font-size:12px;background:#fff8e4;border:1px dashed #caa05a;padding:10px;border-radius:10px;white-space:pre-wrap;max-height:240px;overflow:auto}.checkHdr{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.countGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}@media(max-width:600px){.countGrid{grid-template-columns:1fr}}.countBox{background:#fff7e5;border:1px solid #e1c17b;border-radius:12px;padding:10px}.countBox b{display:block;font-size:20px}.filterBtns{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.filterBtns button{box-shadow:none;padding:7px 10px;border-radius:999px;background:#fff7e5;color:#3b2a16;border:1px solid #d4aa5b}.filterBtns button.active{background:#4b7fa8;color:#fff}.sourceTag{position:absolute;right:9px;top:9px}

<body>
<header>
  <div class="wrap top">
    <div><h1>🌾 Stardew Companion Tracker</h1><p class="subtitle">Local save companion for forgetful perfection runs • Auto + manual tracking</p></div>
    <div class="importBox">
      <label class="fileLabel">Import Save File<input id="fileInput" type="file" /></label>
      <button class="secondary" id="clearManualBtn">Clear Manual Checks</button>
      <div class="note">Select your main save file, e.g. <span class="kbd">FarmName_123456789</span>.<br><br>Do not select <span class="kbd">SaveGameInfo</span>.</div>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="dash"></div>
  <div class="tabs">
    <button class="tab active" data-tab="goals">🎯 What Next?</button>
    <button class="tab" data-tab="ponds">🐟 Fish Ponds</button>
    <button class="tab" data-tab="crafting">🛠️ Crafting</button>
    <button class="tab" data-tab="cooking">🍳 Cooking</button>
    <button class="tab" data-tab="letters">📬 Letters & Rewards</button>
    <button class="tab" data-tab="books">📚 Books</button>
    <button class="tab" data-tab="achievements">🏆 Achievements</button>
    <button class="tab" data-tab="manuals">📝 Manual Notes</button>
    <button class="tab" data-tab="missing">🔎 Missing Help</button>
    <button class="tab" data-tab="debug">🧪 Parser Check</button>
  </div>
  <section class="section active" id="goals"></section>
  <section class="section" id="ponds"></section>
  <section class="section" id="crafting"></section>
  <section class="section" id="cooking"></section>
  <section class="section" id="letters"></section>
  <section class="section" id="books"></section>
  <section class="section" id="achievements"></section>
  <section class="section" id="manuals"></section>
  <section class="section" id="missing"></section>
  <section class="section" id="debug"></section>
</main>
<div class="footer">Local-only tracker. Your save file is read inside your browser. Nothing is uploaded.</div>
<script>
const wiki = n => `https://stardewvalleywiki.com/Special:Redirect/file/${encodeURIComponent(String(n).replaceAll(' ','_'))}.png`;
const CRAFTING=["Wood Fence","Stone Fence","Iron Fence","Hardwood Fence","Gate","Chest","Stone Chest","Big Chest","Torch","Wood Sign","Stone Sign","Dark Sign","Text Sign","Tub o' Flowers","Campfire","Wood Path","Gravel Path","Cobblestone Path","Stepping Stone Path","Crystal Path","Straw Floor","Weathered Floor","Crystal Floor","Wood Floor","Stone Floor","Rustic Plank Floor","Brick Floor","Stone Walkway Floor","Grass Starter","Deluxe Grass Starter","Speed-Gro","Deluxe Speed-Gro","Hyper Speed-Gro","Basic Fertilizer","Quality Fertilizer","Deluxe Fertilizer","Tree Fertilizer","Basic Retaining Soil","Quality Retaining Soil","Deluxe Retaining Soil","Wild Seeds (Sp)","Wild Seeds (Su)","Wild Seeds (Fa)","Wild Seeds (Wi)","Field Snack","Tea Sapling","Fiber Seeds","Mystic Tree Seed","Scarecrow","Deluxe Scarecrow","Cherry Bomb","Bomb","Mega Bomb","Staircase","Explosive Ammo","Transmute (Fe)","Transmute (Au)","Furnace","Charcoal Kiln","Crystalarium","Recycling Machine","Lightning Rod","Bee House","Tapper","Heavy Tapper","Preserves Jar","Keg","Oil Maker","Loom","Cheese Press","Mayonnaise Machine","Seed Maker","Bone Mill","Mushroom Log","Dehydrator","Fish Smoker","Bait Maker","Solar Panel","Ostrich Incubator","Slime Incubator","Slime Egg-Press","Worm Bin","Deluxe Worm Bin","Cookout Kit","Mini-Jukebox","Farm Computer","Geode Crusher","Hopper","Mini-Forge","Warp Totem: Farm","Warp Totem: Mountains","Warp Totem: Beach","Warp Totem: Desert","Warp Totem: Island","Rain Totem","Tent Kit","Wedding Ring","Life Elixir","Monster Musk","Fairy Dust","Challenge Bait","Wild Bait","Magic Bait","Deluxe Bait"];

const ACH_LIST=Object.entries(ACH_MAP).map(([id,name])=>({id:+id,name}));
const BOOKS=[
 {key:"Book_Mystery",name:"Book of Mysteries",img:"Book_Of_Mysteries"},{key:"Book_PriceCatalogue",name:"Price Catalogue",img:"Price_Catalogue"},{key:"Book_AnimalCatalogue",name:"Animal Catalogue",img:"Animal_Catalogue"},{key:"Book_Bombs",name:"Dwarvish Safety Manual",img:"Dwarvish_Safety_Manual"},{key:"Book_Roe",name:"Jewels Of The Sea",img:"Jewels_Of_The_Sea"},{key:"Book_WildSeeds",name:"Raccoon Journal",img:"Raccoon_Journal"},{key:"Book_Woodcutting",name:"Woody's Secret",img:"Woody's_Secret"},{key:"Book_Defense",name:"Jack Be Nimble, Jack Be Thick",img:"Jack_Be_Nimble_Jack_Be_Thick"},{key:"Book_Speed",name:"Way Of The Wind",img:"Way_Of_The_Wind_pt._1"},{key:"Book_Diamonds",name:"Diamond Hunter",img:"Diamond_Hunter"},{key:"Book_Crabbing",name:"The Art O' Crabbing",img:"The_Art_O_Crabbing"},{key:"Book_Trash",name:"The Alleyway Buffet",img:"The_Alleyway_Buffet"},{key:"Book_Marlon",name:"Monster Compendium",img:"Monster_Compendium"},{key:"Book_AnimalCatalogue",name:"Mapping Cave Systems",img:"Mapping_Cave_Systems"}
];
const LETTER_LABELS={guildMember:"Adventurer's Guild unlocked",ccVault:"Vault progress detected",wizardJunimoNote:"Wizard invitation / Community Center magic",hasRustyKey:"Sewer Key received",krobusUnseal:"Krobus / Sewer progress",MagnifyingGlass:"Magnifying Glass unlocked",ccPantry:"Pantry completed",ccBoilerRoom:"Boiler Room completed",ccFishTank:"Fish Tank completed",ccCraftsRoom:"Crafts Room completed",ccBulletin:"Bulletin Board completed",ccVaultComplete:"Vault completed",ccDoorUnlock:"Community Center unlocked",skullKey:"Skull Key obtained",Minecart:"Minecart unlocked",jojaVault:"Bus repair route progress",spring_2_1:"First Spring letter received",BackpackTip:"Backpack tip received",pierreBackpack:"Backpack available at Pierre's",checkedBulletinOnce:"Bulletin board checked"};
const ITEM_NAMES={"162":"Lava Eel","800":"Blobfish","140":"Walleye","698":"Sturgeon","155":"Super Cucumber","393":"Coral","570":"Basalt","82":"Fire Quartz","336":"Gold Bar","72":"Diamond","721":"Snail","604":"Plum Pudding","618":"Bruschetta","390":"Stone","66":"Amethyst","64":"Ruby","60":"Emerald","62":"Aquamarine","70":"Jade","749":"Omni Geode","535":"Geode","536":"Frozen Geode","537":"Magma Geode","787":"Battery Pack","766":"Slime","767":"Bat Wing","768":"Solar Essence","769":"Void Essence","433":"Coffee Bean","95":"Coffee","724":"Maple Syrup"};
const HELP={"Battery Pack":"Build Lightning Rods and wait for thunderstorms. Also check Traveling Cart Friday/Sunday.","Basalt":"Open Magma Geodes from mine floors 81-119. About 1 in 26 chance.","Coral":"Forage on the beach, especially after stormy/rainy days. Check tidal pool side if bridge repaired.","Coffee Bean":"Dust Sprites can drop Coffee Beans. Traveling Cart may sell them. Plant in Spring/Summer or Greenhouse.","Snail":"Use Crab Pots in freshwater: river, lake, or mountain lake. Add bait and check next day.","Walleye":"Fall rain, 12 PM to 2 AM, river/lake/forest pond. In Winter use Rain Totem or Traveling Cart.","Catfish":"Spring/Fall rain, river, any time. Also Secret Woods in rain or Traveling Cart.","Rabbit's Foot":"Rabbit in Deluxe Coop, Serpent drop in Skull Cavern, or Traveling Cart.","Cactus Fruit":"Forage in Calico Desert after bus repair.","Coconut":"Forage in Calico Desert after bus repair.","Jade":"Mines/geodes. Best in Crystalarium; trade to Desert Trader on Sundays for Staircases.","Ruby":"Mines/geodes. Trade at Desert Trader for Spicy Eel.","Gold Bar":"Smelt 5 Gold Ore + 1 Coal. Gold ore is common on mine floors 80-119.","Maple Syrup":"Tap a Maple Tree. Takes several days.","Lucky Lunch":"Recipe uses Sea Cucumber + Tortilla + Blue Jazz. Great Skull Cavern luck food.","Crystalarium":"Craft with 99 Stone, 5 Gold Bars, 2 Iridium Bars, 1 Battery Pack. Best first item: Jade or Diamond."};
function $(id){return document.getElementById(id)}
function directText(el,tag){let n=[...el.children].find(c=>c.tagName===tag);return n?n.textContent:""}
function val(node,tag){let n=node?.getElementsByTagName(tag)?.[0];return n?n.textContent:""}
function normalizeId(s){return (s||"").replace(/\(O\)/g,'').replace(/[^0-9]/g,'')}
function itemName(raw){const id=normalizeId(raw); return ITEM_NAMES[id]||raw||"Unknown"}
function iconImg(name,emoji="🌱"){return `<img src="${wiki(name)}" onerror="this.replaceWith(document.createTextNode('${emoji}'))" alt="">`}
function localKey(section,name){return `sdv3_manual_${section}_${name}`}
function getManual(section,name){return localStorage.getItem(localKey(section,name))==='1'}
function setManual(section,name,val){val?localStorage.setItem(localKey(section,name),'1'):localStorage.removeItem(localKey(section,name))}
function parseDict(xml,tag){const out={}; const root=xml.getElementsByTagName(tag)[0]; if(!root)return out; [...root.getElementsByTagName('item')].forEach(it=>{const key=it.getElementsByTagName('key')[0];const value=it.getElementsByTagName('value')[0]; if(!key||!value)return; const name=(key.getElementsByTagName('string')[0]||key.children[0]||{}).textContent; const count=(value.getElementsByTagName('int')[0]||value.children[0]||{}).textContent||"0"; if(name)out[name]=parseInt(count)||0;}); return out}
function parseAchievements(xml){const root=xml.getElementsByTagName('achievements')[0]; if(!root)return []; return [...root.getElementsByTagName('int')].map(x=>parseInt(x.textContent)).filter(n=>!isNaN(n))}
function parseMail(xml){const root=xml.getElementsByTagName('mailReceived')[0]; if(!root)return []; return [...root.getElementsByTagName('string')].map(x=>x.textContent).filter(Boolean)}
function parsePonds(xml){const ponds=[]; [...xml.getElementsByTagName('Building')].forEach(b=>{const xsi=b.getAttribute('xsi:type')||''; const type=directText(b,'buildingType'); if(!/FishPond|Fish Pond/i.test(xsi+' '+type))return; const fishType=val(b,'fishType')||''; const count=parseInt(directText(b,'currentOccupants')||val(b,'currentOccupants')||'0')||0; const max=parseInt(directText(b,'maxOccupants')||val(b,'maxOccupants')||'10')||10; const gate=val(b,'lastUnlockedPopulationGate')||''; const completed=val(b,'hasCompletedRequest')==='true'; let needed='',neededId='',neededCount=val(b,'neededItemCount')||''; const ni=b.getElementsByTagName('neededItem')[0]; if(ni){needed=val(ni,'name')||''; neededId=val(ni,'itemId')||val(ni,'parentSheetIndex')||'';} const output=b.getElementsByTagName('output')[0]; let outputName=output?val(output,'name'):''; ponds.push({type:itemName(fishType), fishId:normalizeId(fishType), count,max,gate,completed,needed:needed||itemName(neededId),neededId,neededCount,outputName});}); return ponds}
function percent(a,b){return Math.round((a/Math.max(1,b))*100)}
function statCard(icon,title,value,sub,img){return `<div class="card span3"><div class="stat"><div class="icon">${img?iconImg(img,icon):icon}</div><div><h3>${title}</h3><div class="big">${value}</div><div class="mini">${sub||''}</div></div></div></div>`}
function stateFor(section,name,learnedMap,doneMap){const learned=Object.prototype.hasOwnProperty.call(learnedMap,name); const count=learnedMap[name]||0; const done=(doneMap&&doneMap[name]>0)||count>0; const manual=getManual(section,name); if(done)return {kind:'done',label:'Crafted / Made',sub:`Save synced • ${count||doneMap?.[name]||1} time(s)`}; if(learned)return {kind:'learnedOnly',label:'Learned only',sub:'Recipe learned, but not crafted/cooked yet'}; if(manual)return {kind:'manualDone',label:'Manual complete',sub:'Manually checked by you'}; return {kind:'missing',label:'Missing',sub:'Not detected yet'};}
function render(data){window.currentData=data; const craftedDone=CRAFTING.filter(x=>(data.crafting[x]||0)>0||getManual('crafting',x)).length; const craftingLearned=Object.keys(data.crafting).length; const cookedDone=COOKING.filter(x=>(data.cooking[x]||0)>0||getManual('cooking',x)).length; const cookingLearned=Object.keys(data.cooking).length; const books=BOOKS.filter(b=>bookHit(data.mail,b)||getManual('books',b.name)).length;
 $('dash').innerHTML=statCard('🏡','Farm',data.farmName||'Unknown',data.playerName||'Player')+statCard('📅','Date',`Y${data.year} ${data.season} ${data.day}`,'Imported save')+statCard('💰','Gold',Number(data.money||0).toLocaleString(),'Current money','Gold')+statCard('🐟','Ponds',data.ponds.length,data.ponds.length?'Detected on farm':'None detected','Fish_Pond')+statCard('🛠️','Crafted',`${craftedDone}/${CRAFTING.length}`,`${craftingLearned} recipes learned`,'Crafting')+statCard('🍳','Cooked',`${cookedDone}/${COOKING.length}`,`${cookingLearned} recipes learned`,'Cooking')+statCard('📚','Books',`${books}/${BOOKS.length}`,'Read or manual')+statCard('🏆','Achievements',`${data.achievements.length}/${ACH_LIST.length}`,'Save achievement IDs');
 renderGoals(data); renderPonds(data.ponds); renderRecipeSection('crafting','🛠️ Crafting: Learned vs Crafted',CRAFTING,data.crafting,'Crafted'); renderRecipeSection('cooking','🍳 Cooking: Learned vs Cooked',COOKING,data.cooking,'Cooked'); renderLetters(data.mail); renderBooks(data.mail); renderAchievements(data); renderManualNotes(); renderMissingHelp(data); renderDebug(data);
}
function renderRecipeSection(id,title,list,map,verb){const learned=list.filter(x=>Object.prototype.hasOwnProperty.call(map,x)).length; const done=list.filter(x=>(map[x]||0)>0||getManual(id,x)).length; const learnedOnly=list.filter(x=>Object.prototype.hasOwnProperty.call(map,x)&&!(map[x]>0)).length; $(id).innerHTML=`<div class="card span12"><div class="checkHdr"><h2 class="visualTitle"><span class="emoji">${title.split(' ')[0]}</span><span>${title.replace(title.split(' ')[0]+' ','')}</span></h2><span class="pill blue">Save synced + manual option</span></div><p class="mini"><b>Important:</b> learned recipe and actually ${verb.toLowerCase()} are different. This page shows both clearly.</p><div class="countGrid"><div class="countBox"><b>${learned}</b><span class="mini">Learned recipes</span></div><div class="countBox"><b>${done}</b><span class="mini">${verb}</span></div><div class="countBox"><b>${learnedOnly}</b><span class="mini">Learned but not ${verb.toLowerCase()}</span></div></div><div class="bar"><div class="fill" style="width:${percent(done,list.length)}%"></div></div><div class="legend"><span class="pill yes">Crafted/Cooked</span><span class="pill learned">Learned only</span><span class="pill no">Missing</span><span class="pill manual">Manual checked</span></div><input class="search" placeholder="Search..." oninput="filterCards(this,'${id}List')"><div class="filterBtns" data-list="${id}List"><button class="active" onclick="filterStatus(this,'all')">All</button><button onclick="filterStatus(this,'done')">Done</button><button onclick="filterStatus(this,'learnedOnly')">Learned only</button><button onclick="filterStatus(this,'missing')">Missing</button><button onclick="filterStatus(this,'manualDone')">Manual</button></div><div class="items" id="${id}List">${list.map(name=>recipeCard(id,name,map)).join('')}</div></div>`}
function recipeCard(section,name,map){const st=stateFor(section,name,map,null); const badge=st.kind==='done'?'<span class="pill yes sourceTag">Save</span>':st.kind==='learnedOnly'?'<span class="pill learned sourceTag">Learned</span>':st.kind==='manualDone'?'<span class="pill manual sourceTag">Manual</span>':'<span class="pill no sourceTag">Missing</span>'; const manual=getManual(section,name); return `<div class="item ${st.kind}" data-name="${name.toLowerCase()}" data-status="${st.kind}"><div class="itemPic">${iconImg(name, st.kind==='done'?'✅':st.kind==='learnedOnly'?'📘':'□')}</div><div style="padding-right:48px"><div class="itemTitle">${name}</div><div class="itemSub"><b>${st.label}</b><br>${st.sub}</div>${!((map[name]||0)>0)&&HELP[name]?`<div class="help">${HELP[name]}</div>`:''}<label class="toggleLine"><input type="checkbox" ${manual?'checked':''} onchange="toggleManual('${section}',${JSON.stringify(name)},this.checked)"> Manual checkbox</label></div>${badge}</div>`}
function filterCards(input,listId){const q=input.value.toLowerCase(); [...$(listId).children].forEach(c=>c.style.display=c.dataset.name.includes(q)?'flex':'none')}
function filterStatus(btn,status){const parent=btn.parentElement; parent.querySelectorAll('button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); const list=$(parent.dataset.list); [...list.children].forEach(c=>c.style.display=(status==='all'||c.dataset.status===status)?'flex':'none')}
function toggleManual(section,name,checked){setManual(section,name,checked); if(window.currentData)render(window.currentData)}
function renderPonds(ponds){$('ponds').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🐟</span><span>Fish Pond Dashboard</span></h2><p class="mini">This now reads FishPond buildings directly: fish type, population, max population, output, and current request item.</p>${ponds.length?`<div class="ponds">${ponds.map((p,i)=>{let pct=percent(p.count,p.max), need=p.needed&&p.needed!=='Unknown'&&p.needed!=='0'; return `<div class="pond"><div class="pondHead"><div class="icon">${iconImg(p.type,'🐟')}</div><div><h3>Pond #${i+1}: ${p.type}</h3><div class="mini">Fish ID ${p.fishId||'?'} • Gate ${p.gate||'?'} • ${p.completed?'Request completed':'Waiting / growing'}</div></div></div><br><div class="pondMeter"><span style="width:${pct}%"></span></div><p><b>Population:</b> ${p.count}/${p.max}</p><p><b>Output ready:</b> ${p.outputName?`<span class="pill yes">${p.outputName}</span>`:`<span class="pill warn">None detected</span>`}</p><p><b>Request:</b> ${need?`<span class="pill warn">${p.neededCount||''} ${p.needed}</span>`:`<span class="pill yes">No active request detected</span>`}</p>${need&&HELP[p.needed]?`<div class="help"><b>How to get ${p.needed}:</b> ${HELP[p.needed]}</div>`:''}</div>`}).join('')}</div>`:`<div class="empty">No fish ponds detected yet.</div>`}</div>`}
function renderLetters(mail){const display=mail.map(f=>({raw:f,label:LETTER_LABELS[f]||friendlyFlag(f)})).filter(x=>!/^button_tut|^menu|^tutorial/i.test(x.raw)); $('letters').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📬</span><span>Letters & Rewards</span></h2><p class="mini">This is the friendly version of Stardew's internal mail/event flags. Technical flags are hidden or translated when known.</p><input class="search" placeholder="Search letters and rewards..." oninput="filterCards(this,'lettersList')"><br><br><div class="items" id="lettersList">${display.slice(0,220).map(({raw,label})=>`<div class="item done" data-name="${(label+' '+raw).toLowerCase()}"><div class="itemPic">✉️</div><div><div class="itemTitle">${label}</div><div class="itemSub">Detected from save</div></div></div>`).join('')||'<div class="empty">No letters detected.</div>'}</div></div>`}
function friendlyFlag(f){return f.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/^./,c=>c.toUpperCase())}
function bookHit(mail,b){return mail.some(f=>f.includes(b.key)||f.toLowerCase().includes(b.name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)))}
function renderBooks(mail){const rows=BOOKS.map(b=>({name:b.name,img:b.img,hit:bookHit(mail,b)||getManual('books',b.name),auto:bookHit(mail,b)})); const read=rows.filter(x=>x.hit).length; $('books').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">📚</span><span>Books Read</span></h2><p class="mini">Books are partly detected from 1.6 mail/reward flags. Use manual checkbox if the save flag is not recognized.</p><div class="bar"><div class="fill" style="width:${percent(read,rows.length)}%"></div></div><br><div class="items">${rows.map(b=>`<div class="item ${b.hit?'done':'missing'}" data-name="${b.name.toLowerCase()}"><div class="itemPic">${iconImg(b.img,'📘')}</div><div><div class="itemTitle">${b.name}</div><div class="itemSub">${b.auto?'Save synced':b.hit?'Manual complete':'Not detected'}</div><label class="toggleLine"><input type="checkbox" ${getManual('books',b.name)?'checked':''} onchange="toggleManual('books',${JSON.stringify(b.name)},this.checked)"> Manual checkbox</label></div></div>`).join('')}</div></div>`}
function renderAchievements(data){const doneSet=new Set(data.achievements); $('achievements').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🏆</span><span>Steam-Style Achievements</span></h2><p class="mini">Uses achievement IDs saved in the file. Manual checkbox is available if Steam already has it but the save does not show it.</p><div class="bar"><div class="fill" style="width:${percent(data.achievements.length,ACH_LIST.length)}%"></div></div><br><div class="items">${ACH_LIST.map(a=>{const auto=doneSet.has(a.id), man=getManual('achievements',a.name), done=auto||man; return `<div class="item ${done?'done':'missing'}" data-name="${a.name.toLowerCase()}"><div class="itemPic">🏆</div><div><div class="itemTitle">${a.name}</div><div class="itemSub">${auto?'Save achievement ID '+a.id:man?'Manual complete':'Not detected'}</div><label class="toggleLine"><input type="checkbox" ${man?'checked':''} onchange="toggleManual('achievements',${JSON.stringify(a.name)},this.checked)"> Manual checkbox</label></div></div>`}).join('')}</div></div>`}
function renderManualNotes(){const notes=JSON.parse(localStorage.getItem('sdv3_notes')||'[]'); $('manuals').innerHTML=`<div class="grid"><div class="card span6"><h2>📝 Personal Checklist</h2><p class="mini">For reminders the save cannot know: birthdays, items to save, next shopping trip, etc.</p><div style="display:flex;gap:8px"><input class="search" id="newNote" placeholder="Example: Buy Strawberry Seeds Spring 13"><button onclick="addNote()">Add</button></div><br><div id="notesList">${notes.map((n,i)=>`<div class="row"><label><input type="checkbox" ${n.done?'checked':''} onchange="toggleNote(${i},this.checked)"> ${n.text}</label><button class="gray" onclick="deleteNote(${i})">X</button></div>`).join('')||'<div class="empty">No personal notes yet.</div>'}</div></div><div class="card span6"><h2>🟢 Auto + 🔵 Manual</h2><p>Save-synced items come directly from the imported Stardew save file.</p><p>Manual checkbox is for corrections, personal planning, or if a Stardew/mod save flag is not recognized.</p><div class="season"><b>Best practice:</b><br>Use manual checks only when you know the save parser missed something.</div></div></div>`}
function addNote(){const input=$('newNote'); const text=input.value.trim(); if(!text)return; const notes=JSON.parse(localStorage.getItem('sdv3_notes')||'[]'); notes.push({text,done:false}); localStorage.setItem('sdv3_notes',JSON.stringify(notes)); input.value=''; renderManualNotes()}
function toggleNote(i,done){const notes=JSON.parse(localStorage.getItem('sdv3_notes')||'[]'); if(notes[i])notes[i].done=done; localStorage.setItem('sdv3_notes',JSON.stringify(notes)); renderManualNotes()}
function deleteNote(i){const notes=JSON.parse(localStorage.getItem('sdv3_notes')||'[]'); notes.splice(i,1); localStorage.setItem('sdv3_notes',JSON.stringify(notes)); renderManualNotes()}
function renderMissingHelp(data){const important=['Battery Pack','Basalt','Coral','Coffee Bean','Snail','Catfish','Walleye','Rabbit\'s Foot','Coconut','Cactus Fruit','Jade','Ruby','Lucky Lunch','Crystalarium']; $('missing').innerHTML=`<div class="card span12"><h2 class="visualTitle"><span class="emoji">🔎</span><span>Missing Item Help Guide</span></h2><p class="mini">Quick hints for commonly forgotten items, fish pond requests, and perfection blockers.</p><div class="items">${important.map(n=>`<div class="item"><div class="itemPic">${iconImg(n,'❓')}</div><div><div class="itemTitle">${n}</div><div class="itemSub">${HELP[n]||'Helpful item to track.'}</div></div></div>`).join('')}</div></div>`}
function renderGoals(data){const goals=[]; const spring=data.season==='spring'; data.ponds.forEach(p=>{if(p.needed&&p.needed!=='Unknown'&&p.needed!=='0')goals.push(['high','🐟',`${p.type} pond needs ${p.neededCount||''} ${p.needed}`,HELP[p.needed]||'Complete this request to raise pond population.']);});
 if(!data.crafting['Lightning Rod'])goals.push(['high','🌩️','Craft Lightning Rod','Needed for Battery Packs after storms. Battery Pack helps craft Crystalarium.']);
 if(!data.crafting['Crystalarium'])goals.push(['mid','💎','Get or craft Crystalarium','Best first use: Jade for Sunday staircases, or Diamond for money/gifts.']);
 if(spring)goals.push(['mid','🍓','Save money for Egg Festival strawberries','Spring 13. Buy Strawberry Seeds there; they are strong Spring income.']);
 if(!data.cooking['Lucky Lunch'])goals.push(['low','🍀','Learn/cook Lucky Lunch later','Sea Cucumber + Blue Jazz + Tortilla. Great for Skull Cavern.']);
 if(!data.mail.some(x=>/ccBoilerRoom|Minecart/i.test(x)))goals.push(['mid','⚙️','Finish Boiler Room / Minecarts if incomplete','Fast travel saves time every day. Check Adventurer Bundle.']);
 $('goals').innerHTML=`<div class="grid"><div class="card span8"><h2 class="visualTitle"><span class="emoji">🎯</span><span>What Should I Do Next?</span></h2><p class="mini">Personalized recommendations from your imported save.</p>${goals.map((g,i)=>`<div class="row goal ${g[0]}"><div><div class="smallcaps">Priority ${i+1}</div><b>${g[1]} ${g[2]}</b><div class="mini">${g[3]}</div></div><span class="pill ${g[0]==='high'?'no':g[0]==='mid'?'blue':'yes'}">${g[0]}</span></div>`).join('')||'<div class="empty">No obvious urgent goals detected.</div>'}</div><div class="card span4"><h2>🧠 Forgetful Mode</h2><p>This app avoids technical save-file words and shows simple next steps.</p><div class="season"><b>Recipe states:</b><br><span class="pill learned">Learned only</span> means you know the recipe but have not made it yet.</div><br><div class="season"><b>Manual checkbox:</b><br>Use only if the game/save parser misses something you know is complete.</div></div></div>`}
function renderDebug(data){$('debug').innerHTML=`<div class="card span12"><h2>🧪 Parser Check</h2><p class="mini">Use this to verify the save parser is reading the correct sections.</p><div class="debug">Farm: ${data.farmName}\nPlayer: ${data.playerName}\nDate: Year ${data.year}, ${data.season} ${data.day}\nCrafting recipes learned: ${Object.keys(data.crafting).length}\nCrafting recipes with count > 0: ${Object.values(data.crafting).filter(v=>v>0).length}\nCooking recipes learned: ${Object.keys(data.cooking).length}\nCooking recipes with count > 0: ${Object.values(data.cooking).filter(v=>v>0).length}\nAchievements IDs: ${data.achievements.join(', ')}\nLetters/reward flags: ${data.mail.length}\nFish ponds detected: ${data.ponds.length}\n${data.ponds.map((p,i)=>`Pond ${i+1}: ${p.type} ${p.count}/${p.max}, request ${p.neededCount||''} ${p.needed||'none'}, output ${p.outputName||'none'}`).join('\n')}</div></div>`}
function parseSave(text){const xml=new DOMParser().parseFromString(text,'text/xml'); if(xml.querySelector('parsererror'))throw new Error('XML parse error'); const p=xml.getElementsByTagName('player')[0]||xml; return {playerName:val(p,'name'),farmName:val(p,'farmName'),year:val(xml,'year')||'?',season:val(xml,'season')||'?',day:val(xml,'dayOfMonth')||'?',money:val(p,'money')||val(xml,'money'),crafting:parseDict(xml,'craftingRecipes'),cooking:parseDict(xml,'cookingRecipes'),mail:parseMail(xml),ponds:parsePonds(xml),achievements:parseAchievements(xml)}}
$('fileInput').addEventListener('change',async e=>{const f=e.target.files[0]; if(!f)return; try{const data=parseSave(await f.text()); localStorage.setItem('lastImportName',f.name); render(data);}catch(err){alert('Could not parse save file. Select the main farm save file, not SaveGameInfo.'); console.error(err)}});
$('clearManualBtn').onclick=()=>{if(!confirm('Clear all manual checkboxes and notes?'))return; Object.keys(localStorage).filter(k=>k.startsWith('sdv3_manual_')||k==='sdv3_notes').forEach(k=>localStorage.removeItem(k)); if(window.currentData)render(window.currentData)};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));t.classList.add('active');$(t.dataset.tab).classList.add('active')});
render({playerName:'No save imported',farmName:'Import your save file',year:'?',season:'?',day:'?',money:0,crafting:{},cooking:{},mail:[],ponds:[],achievements:[]});
</script>
</body>
</html>
